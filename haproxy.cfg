global
    log stdout format raw local0

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 10s
    timeout client 30s
    timeout server 30s

frontend http
    bind *:80
    default_backend traefik-http

frontend https
    bind *:443
    default_backend traefik-https

# Traefik backend: resolved via libc (getaddrinfo), i.e. /etc/hosts, which is
# kept in sync with traefik's current tailnet IP by the traefik-ip-sync
# systemd timer (reads `tailscale status`, HUP-reloads HAProxy on change).
# The Oracle VPS runs tailscale with --accept-dns=false (by design, see
# AGENTS.md), so MagicDNS resolvers (100.100.100.100) MUST NOT be used here —
# HAProxy would fail to resolve the name at startup and crash-loop.
# init-addr last,libc,none: if /etc/hosts is stale at boot, start with the
# backend down instead of aborting; the timer fixes /etc/hosts and reloads.
backend traefik-http
    server traefik traefik.fold-hen.ts.net:80 send-proxy-v2 init-addr last,libc,none

backend traefik-https
    server traefik traefik.fold-hen.ts.net:443 send-proxy-v2 init-addr last,libc,none
