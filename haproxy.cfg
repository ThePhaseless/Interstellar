global
    log stdout format raw local0

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 10s
    timeout client 30s
    timeout server 30s

frontend http
    bind *:80
    default_backend traefik-http

frontend https
    bind *:443
    default_backend traefik-https

# Traefik backend: pinned Tailscale IP, enforced via the
# tailscale.com/tailnet-ip annotation on the traefik Service. The Oracle VPS
# runs tailscale with --accept-dns=false (by design, see AGENTS.md), so
# MagicDNS names (traefik.fold-hen.ts.net) MUST NOT be used here — HAProxy
# fails to resolve them at startup and crash-loops.
backend traefik-http
    server traefik 100.72.236.33:80 send-proxy-v2

backend traefik-https
    server traefik 100.72.236.33:443 send-proxy-v2
