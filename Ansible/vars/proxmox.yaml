# Sized so a runaway grab cannot push the pool into the range where ZFS
# write performance collapses; raise only alongside pool capacity.
downloads_hdd_quota: 2T

fan_control_chip: nct6797
fan_control_pwm1: 30
fan_control_pwm2: 60

# The NVMe branch needs its own floor: the global minfreespace is measured
# against sparse files, so 25G never trips there. Reserved as growth room for
# the torrents already on it.
downloads_ssd_minfreespace: 75G

# Joined with commas at use: a folded scalar would splice in spaces, and the
# mount module then sees opts that differ from fstab and tries to remount --
# which fails, because knfsd holds the export busy.
downloads_pool_mount_opts:
  - category.create=ff
  - minfreespace=25G
  - moveonenospc=true
  - noforget
  - inodecalc=path-hash
  - cache.files=partial
  - dropcacheonclose=true
  - allow_other
  - x-systemd.requires=zfs-mount.service
  - x-systemd.before=nfs-server.service
  - _netdev

nfs_default_export_options: rw,sync,no_subtree_check,no_root_squash

nfs_exports:
  - path: /Storage # HDD — large media library
  - path: /SSDStorage # SSD — active/personal files
  # Its own pool, not a directory under /SSDStorage: that one shares a dataset
  # with the Proxmox root, which has no quota. Export the pool root and let the
  # PV mount the subdirectory, mirroring /Storage — a path in both this list and
  # media_managed_paths flaps between mode 0755 and 2775 on every run.
  - path: /ssdstage # NVMe — qBittorrent download staging
  # fsid is mandatory for a FUSE mount: nfsd cannot derive a stable one, and
  # without it clients get ESTALE on every reconnect.
  - path: /srv/downloads
    options: rw,sync,no_subtree_check,no_root_squash,fsid=72

# Node IPs are vmid-based: 192.168.1.<vmid>.
nfs_allowed_hosts:
  - 127.0.0.1 # proxmox host itself (for health-check mounts)
  - 192.168.1.110 # talos-1
  - 192.168.1.111 # talos-2
  - 192.168.1.112 # talos-3

# Shared by Sonarr/Radarr/Bazarr/qBittorrent.
media_runtime_uid: 1000
media_runtime_gid: 1000

media_managed_paths:
  - /Storage/Media/TVShows
  - /Storage/Media/Movies
  - /Storage/Media/Downloads
  - /ssdstage/downloads
