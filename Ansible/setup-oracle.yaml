- name: Configure Oracle VPS Instances
  hosts: oracle
  become: true
  tasks:
    - name: Update packages
      ansible.builtin.import_tasks: tasks/update-apt.yaml

- name: Setup Tailscale on all Oracle instances
  hosts: oracle
  become: true
  vars_files:
    - vars/oracle.yaml
  roles:
    - role: artis3n.tailscale.machine

- name: Open firewall ports on Proxy VPS
  hosts: oracle_proxy
  become: true
  tasks:
    - name: Allow HTTP traffic through iptables
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "80"
        ctstate: NEW
        jump: ACCEPT
        action: insert
        rule_num: 5

    - name: Allow HTTPS traffic through iptables
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "443"
        ctstate: NEW
        jump: ACCEPT
        action: insert
        rule_num: 6

    - name: Persist iptables rules
      ansible.builtin.shell: iptables-save > /etc/iptables/rules.v4
      changed_when: true

- name: Deploy HAProxy on Proxy VPS
  hosts: oracle_proxy
  become: true
  pre_tasks:
    - name: Resolve Traefik tailnet IP from the control node
      delegate_to: localhost
      become: false
      ansible.builtin.shell: |
        tailscale status --json | jq -r '
          [.Peer[] | select(.HostName == "traefik")
           | .TailscaleIPs[] | select(contains("."))][0] // ""'
      register: traefik_ip_lookup
      failed_when: false
      changed_when: false

    - name: Fail if Traefik tailnet IP is unknown
      delegate_to: localhost
      become: false
      ansible.builtin.fail:
        msg: >-
          Could not find the 'traefik' peer in 'tailscale status --json' on the
          Ansible control node (CI connects via tailscale/github-action before
          this playbook; local runs need tailscale up). Refusing to deploy a
          broken haproxy.cfg.
      when: traefik_ip_lookup.stdout | trim | length == 0

    - name: Set Traefik backend IP fact
      ansible.builtin.set_fact:
        traefik_tailscale_ip: "{{ traefik_ip_lookup.stdout | trim }}"
  roles:
    - geerlingguy.docker
  tasks:
    - name: Create HAProxy directory
      ansible.builtin.file:
        path: /opt/haproxy
        state: directory
        mode: "0755"

    - name: Copy Docker Compose file
      ansible.builtin.copy:
        src: ../compose.proxy.yaml
        dest: /opt/haproxy/compose.yaml
        mode: "0644"

    - name: Template HAProxy config with deploy-time Traefik IP
      ansible.builtin.template:
        src: ../haproxy.cfg.j2
        dest: /opt/haproxy/haproxy.cfg
        mode: "0644"
        validate: 'docker run --rm -v %s:/tmp/haproxy.cfg:ro haproxy:latest haproxy -c -f /tmp/haproxy.cfg'
      notify: Restart HAProxy

    - name: Start HAProxy stack
      community.docker.docker_compose_v2:
        project_src: /opt/haproxy
        state: present
        pull: always

    - name: Check for legacy Traefik IP sync timer
      ansible.builtin.stat:
        path: /etc/systemd/system/traefik-ip-sync.timer
      register: legacy_sync_timer

    - name: Disable legacy Traefik IP sync timer
      ansible.builtin.systemd:
        name: traefik-ip-sync.timer
        state: stopped
        enabled: false
        daemon_reload: true
      when: legacy_sync_timer.stat.exists

    - name: Remove legacy Traefik IP sync files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/traefik-ip-sync.timer
        - /etc/systemd/system/traefik-ip-sync.service
        - /opt/haproxy/sync-traefik-ip.sh

    - name: Remove legacy /etc/hosts entry
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '\s+traefik\.fold-hen\.ts\.net$'
        state: absent

  handlers:
    - name: Restart HAProxy
      community.docker.docker_compose_v2:
        project_src: /opt/haproxy
        state: restarted
        services:
          - haproxy
