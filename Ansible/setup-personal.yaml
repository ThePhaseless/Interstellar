---
# Run from your own machine, never from CI: the policy gives tag:ci no route to
# an untagged device. Tailscale enrolment is absent because untagged keys are
# issued to people, so enrolling one is a browser login.
- name: Configure unattended upgrades on personal devices
  hosts: personal
  become: true
  vars:
    unattended_reboot_time: "04:00"
  tasks:
    - name: Apply unattended-upgrades configuration
      ansible.builtin.import_tasks: tasks/unattended-upgrades.yaml
