---
# Enrols the Oracle proxy VPS when it is not on the tailnet yet — the one case
# inventory_tailscale.py cannot cover, because it only lists tailnet members.
#
#   ansible-playbook bootstrap-oracle.yaml -i "<public-ip>,"
#
# There are exactly two Oracle VMs and this playbook is only ever for 'proxy'.
# 'compute' is a personal device: it is enrolled by hand with a browser login,
# never with the tag:oracle key, so it is deliberately absent here.
#
# Port 22 must be open for the run — see .github/workflows/oracle-bootstrap.yaml,
# which flips Terraform's oracle_ssh_public_access on and back off around it.
- name: Bootstrap Tailscale on the Oracle proxy VPS
  hosts: all
  become: true
  vars_files:
    - vars/oracle.yaml
  vars:
    ansible_user: ubuntu
    # CI has no such file — it loads the key into ssh-agent instead. Ansible sets
    # IdentityFile without IdentitiesOnly, so a missing path falls back to the
    # agent rather than failing.
    ansible_ssh_private_key_file: ~/.ssh/oracle_ed25519
    # The inventory here is a bare IP, so inventory_hostname cannot supply the
    # tailnet name the way it does under inventory_tailscale.py.
    tailscale_args: --ssh --hostname=proxy --accept-dns=false

  pre_tasks:
    - name: Fail early when the Oracle auth key is missing
      ansible.builtin.assert:
        that:
          - tailscale_authkey | default('', true) | length > 0
        fail_msg: >-
          TAILSCALE_ORACLE_AUTH_KEY is empty. Export it from Bitwarden
          ('tailscale-oracle-auth-key', or 'source scripts/setup-env.sh')
          before running this playbook.
      run_once: true
      delegate_to: localhost
      become: false

    - name: Read the current Tailscale state
      ansible.builtin.command: tailscale status --json
      register: tailscale_state
      changed_when: false
      failed_when: false

    - name: Assume the host is not enrolled
      ansible.builtin.set_fact:
        tailscale_enrolled: false

    # Anything other than NoState/NeedsLogin means tailscaled already holds an
    # identity. Testing for 'Running' alone would call an enrolled host that is
    # rebooting, stopped, or still starting "not enrolled" and overwrite it.
    - name: Record whether this host already holds a Tailscale identity
      ansible.builtin.set_fact:
        tailscale_enrolled: >-
          {{
            (tailscale_state.stdout | from_json).BackendState
            not in ['NoState', 'NeedsLogin']
          }}
      when:
        - tailscale_state.rc == 0
        - tailscale_state.stdout is search('^\s*\{')

    - name: Skip a host that is already enrolled
      when: tailscale_enrolled | bool
      block:
        - name: Report the skip
          ansible.builtin.debug:
            msg: >-
              This host already has a Tailscale identity — leaving it untouched.
              Use 'tailscale up --force-reauth' on the host to change it
              deliberately.

        - name: End play for this host
          ansible.builtin.meta: end_host

    # The instance's user_data runs apt-get on first boot. The Tailscale role's
    # apt tasks set no lock_timeout, so starting while cloud-init still holds
    # /var/lib/dpkg/lock-frontend fails the run outright.
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init_status
      changed_when: false
      failed_when: false

  roles:
    - role: artis3n.tailscale.machine

  post_tasks:
    - name: Confirm the host reached the tailnet
      ansible.builtin.command: tailscale status --json
      register: tailscale_result
      changed_when: false
      retries: 6
      delay: 5
      until:
        - tailscale_result.rc == 0
        - (tailscale_result.stdout | from_json).BackendState == 'Running'

    - name: Report the assigned tailnet address
      ansible.builtin.debug:
        msg: >-
          proxy enrolled as
          {{ (tailscale_result.stdout | from_json).Self.DNSName | trim('.') }}
          ({{ (tailscale_result.stdout | from_json).Self.TailscaleIPs | first }})
