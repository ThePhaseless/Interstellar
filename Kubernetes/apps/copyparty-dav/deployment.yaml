apiVersion: apps/v1
kind: Deployment
metadata:
  name: copyparty-dav
  namespace: utilities
  labels:
    app: copyparty-dav
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app: copyparty-dav
  template:
    metadata:
      labels:
        app: copyparty-dav
    spec:
      containers:
        - name: copyparty
          image: ghcr.io/9001/copyparty-ac:1.20.21
          args:
            - -c
            - /config/copyparty-dav.conf
          ports:
            - name: http
              containerPort: 3923
          volumeMounts:
            - name: config-template
              mountPath: /config
              readOnly: true
            # Read-only: the only ACL this instance serves is `r: *`, so it
            # never needs write access to personal-pvc.
            - name: personal
              mountPath: /personal
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: config-template
          configMap:
            name: copyparty-dav-config
        - name: personal
          persistentVolumeClaim:
            claimName: personal-pvc
