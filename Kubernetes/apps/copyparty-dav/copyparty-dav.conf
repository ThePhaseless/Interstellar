[global]
# Web server settings
i: 0.0.0.0
p: 3923

# Without this the UI and document titles show the pod hostname, which changes
# on every restart. Distinct from the Traefik instance so the two are tellable
# apart when both are open.
name: nerine.dev WebDAV

# Direct WebDAV listener for the Tailscale path (service-tailscale.yaml).
# This instance deliberately defines no idp-h-usr / idp-h-grp and no xff-src:
# the Tailscale operator proxies at L3 without rewriting headers, so anything
# resembling an identity header on this path is chosen by the client, not by a
# trusted proxy. With IdP unconfigured there is nothing a forged X-authentik-*
# header can bind to, and callers fall back to the local accounts below.
# The Traefik-fronted instance (copyparty.conf) is the one that consumes IdP.
daw

# Logging
lo: /dev/stdout

# Security
no-robots
no-logues

# Performance
hist: 0

[accounts]
  guest: guest

# Only the public share is served here. Everything else on personal-pvc stays
# reachable exclusively through Traefik + Authentik.
[/personal/public]
  /personal/public
  accs:
    r: *
