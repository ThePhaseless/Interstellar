apiVersion: apps/v1
kind: Deployment
metadata:
  name: byparr
  namespace: media
  labels:
    app: byparr
spec:
  selector:
    matchLabels:
      app: byparr
  template:
    metadata:
      labels:
        app: byparr
    spec:
      shareProcessNamespace: true
      volumes:
        - name: dshm
          emptyDir:
            sizeLimit: 1Gi
      containers:
        - name: byparr
          image: ghcr.io/thephaseless/byparr:3.0.4
          ports:
            - name: http
              containerPort: 8191
          env:
            - name: PROXY_SERVER
              valueFrom:
                secretKeyRef:
                  name: byparr-proxy
                  key: proxy-server
                  optional: true
            - name: PROXY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: byparr-proxy
                  key: proxy-username
                  optional: true
            - name: PROXY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: byparr-proxy
                  key: proxy-password
                  optional: true
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
