apiVersion: apps/v1
kind: Deployment
metadata:
  name: byparr
  namespace: media
  labels:
    app: byparr
spec:
  selector:
    matchLabels:
      app: byparr
  template:
    metadata:
      labels:
        app: byparr
    spec:
      shareProcessNamespace: true
      # Firefox is launched per solve and writes ~77 MB of throwaway profile
      # and temp data each time (ThePhaseless/Byparr#414). Keep /tmp and
      # /dev/shm in RAM so that churn never reaches the node's SSD. /cache
      # must stay on the image: it holds the baked-in Firefox binary.
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
      containers:
        - name: byparr
          image: ghcr.io/thephaseless/byparr:3.1.1@sha256:c66fa161187b8fa527bfad7eefa2647ea1c553f77df68cbffd6fe83366d1787b
          ports:
            - name: http
              containerPort: 8191
          # Byparr opens its port only after fetching the GeoIP database and
          # egress IP at start, so an open port means ready to solve.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          env:
            - name: PROXY_SERVER
              valueFrom:
                secretKeyRef:
                  name: byparr-proxy
                  key: proxy-server
                  optional: true
            - name: PROXY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: byparr-proxy
                  key: proxy-username
                  optional: true
            - name: PROXY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: byparr-proxy
                  key: proxy-password
                  optional: true
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              # tmpfs pages count against this limit, so it covers both
              # in-memory volumes on top of the browser itself.
              memory: 3Gi
