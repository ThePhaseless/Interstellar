apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: utilities

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: copyparty-config
    options:
      disableNameSuffixHash: true
    files:
      - copyparty.conf

labels:
  - pairs:
      app: copyparty
    includeSelectors: true
