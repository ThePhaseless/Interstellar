apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: copyparty
  namespace: utilities
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`files.nerine.dev`)
      services:
        - name: copyparty
          port: 3923
      middlewares:
        - name: public-chain
          namespace: traefik
        # Before authentik, so an anonymous old public link redirects instead of hitting login.
        - name: copyparty-old-urls
        - name: authentik
          namespace: traefik
  tls:
    certResolver: letsencrypt
    domains:
      - main: nerine.dev
        sans:
          - "*.nerine.dev"
---
# Links shared before the sections moved from /personal/<section> to /<section>;
# the old virtual root /personal goes to /.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: copyparty-old-urls
  namespace: utilities
spec:
  redirectRegex:
    regex: "^https://files\\.nerine\\.dev/personal(/(public|members|private)([/?].*)?|/?([?].*)?)$"
    replacement: "https://files.nerine.dev/${2}${3}${4}"
