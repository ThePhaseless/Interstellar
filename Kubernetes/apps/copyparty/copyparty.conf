[global]
i: 0.0.0.0

# Defaults to the pod hostname, which changes on every restart.
name: nerine.dev

# Trust X-Forwarded-For — every request arrives via Traefik.
rproxy: 1

# @admins / @writers in the ACLs below are Authentik groups (X-authentik-groups).
# https://github.com/9001/copyparty/blob/hovudstraum/docs/idp.md
# Safe only because Traefik's forwardAuth deletes any client-supplied
# X-authentik-* header before setting it from the auth response.
auth-ord: idp
idp-h-usr: X-authentik-username
idp-h-grp: X-authentik-groups

# 2+ (not the default 1) so the main process re-reads group mappings on config
# reload; without it @group ACLs never match an IdP user.
idp-store: 2

# Traefik runs in-cluster, so IdP headers are trusted from private IPs.
xff-src: lan

# Makes PUTs overwrite existing files, so WebDAV file-manager edits save in place.
daw

lo: /dev/stdout

no-robots
no-logues

hist: 0

# No [/personal] volume: /personal is a virtual folder that lists only the
# sections a user can read, so nothing can be uploaded at its root.

[/personal/private]
  /personal/private
  accs:
    rwmda: @admins

# Any Authentik account may read; @acct is copyparty's built-in group of every
# known user (IdP users join it on first request). The copyparty application in
# Authentik binds any_user, so there is no allowlist.
[/personal/members]
  /personal/members
  accs:
    r: @acct
    rwmda: @writers
    rwmda: @admins
  flags:
    # A symlink here into private is checked against private's ACL, not ours.
    xvol

[/personal/public]
  /personal/public
  accs:
    r: *
    rwmda: @writers
    rwmda: @admins
  flags:
    # Follow symlinks out of this volume (e.g. one made over clips-sftp) only
    # with the target volume's permissions, so an anonymous reader cannot use
    # one to reach members or private.
    xvol

[/media]
  /media
  accs:
    rwmda: @admins
