[global]
i: 0.0.0.0
p: 3923

# Without this the UI and document titles show the pod hostname, which changes
# on every restart. doctitle and bname both derive from it.
name: nerine.dev

# Trust X-Forwarded-For — every request arrives via Traefik.
rproxy: 1

# Identity comes from headers Authentik forward-auth injects: the username
# header becomes the copyparty user, the groups header a comma-separated list
# the volume ACLs below match as @admins / @writers.
# https://github.com/9001/copyparty/blob/hovudstraum/docs/idp.md
# Safe only because Traefik's forwardAuth deletes any client-supplied
# X-authentik-* header before setting it from the auth response.
auth-ord: idp
idp-h-usr: X-authentik-username
idp-h-grp: X-authentik-groups

# 2+ (not the default 1) so the main process re-reads group mappings on config
# reload; without it @group ACLs never match an IdP user.
idp-store: 2

# Traefik runs in-cluster, so IdP headers are trusted from private IPs.
xff-src: lan

# WebDAV, for native file-manager access; the volume ACLs below still apply.
daw

lo: /dev/stdout

no-robots
no-logues

hist: 0

[/personal]
  /personal
  accs:
    rwmda: @admins

[/personal/public]
  /personal/public
  accs:
    r: *
    rwmda: @writers
    rwmda: @admins

[/media]
  /media
  accs:
    rwmda: @admins
