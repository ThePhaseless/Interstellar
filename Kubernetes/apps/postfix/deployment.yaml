apiVersion: apps/v1
kind: Deployment
metadata:
  name: postfix
  namespace: utilities
  labels:
    app: postfix
spec:
  selector:
    matchLabels:
      app: postfix
  template:
    metadata:
      labels:
        app: postfix
    spec:
      containers:
        - name: postfix
          image: boky/postfix:5.1.0
          env:
            - name: RELAYHOST
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: host
            - name: RELAYHOST_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: username
            - name: RELAYHOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smtp-credentials
                  key: password
            - name: ALLOWED_SENDER_DOMAINS
              value: "nerine.dev"
            - name: HOSTNAME
              value: "mail.nerine.dev"
            - name: MESSAGE_SIZE_LIMIT
              value: "26214400"
            - name: LOG_FORMAT
              value: "json"
            - name: TZ
              value: Europe/Warsaw
          ports:
            - name: smtp
              containerPort: 587
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            tcpSocket:
              port: smtp
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: smtp
            initialDelaySeconds: 10
