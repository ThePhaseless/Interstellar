apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - common/nfs-storage-config.yaml

  - namespaces.yaml

  - common/

  - jellyfin/
  - seerr/
  - sonarr/
  - radarr/
  - prowlarr/
  - bazarr/
  - qbittorrent/
  - decluttarr/
  - recyclarr/
  - arr-coverage-search/
  - byparr/
  - byparr-proxy/

  - postfix/
  - copyparty/
  - immich/
  - adguard/
  - cloudflare-ddns/

  - networkpolicies/

  - descheduler/

  - borgbackup/
  - media-backup/
  - home-backup/

replacements:
  - source:
      kind: ConfigMap
      name: nfs-storage-config
      fieldPath: data.server
    targets:
      - select:
          kind: PersistentVolume
          name: media-nfs-pv
        fieldPaths:
          - spec.nfs.server
      - select:
          kind: PersistentVolume
          name: media-nfs-pv-utilities
        fieldPaths:
          - spec.nfs.server
      - select:
          kind: PersistentVolume
          name: downloads-nfs-pv
        fieldPaths:
          - spec.nfs.server
      - select:
          kind: PersistentVolume
          name: personal-nfs-pv
        fieldPaths:
          - spec.nfs.server
      - select:
          kind: PersistentVolume
          name: photos-nfs-pv
        fieldPaths:
          - spec.nfs.server
