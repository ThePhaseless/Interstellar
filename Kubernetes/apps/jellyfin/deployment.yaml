apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
  labels:
    app: jellyfin
  annotations:
    # Auto-restart on config/secret changes
    reloader.stakater.com/auto: "true"
spec:
  strategy:
    type: Recreate # GPU can't be shared
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # Resolve Authentik through Traefik locally instead of patching CoreDNS.
      hostAliases:
        - ip: 192.168.1.11
          hostnames:
            - auth.nerine.dev
      # Schedule on GPU node
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"

      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:10.11.11
          ports:
            - name: http
              containerPort: 8096
          env:
            - name: JELLYFIN_PublishedServerUrl
              value: "https://watch.nerine.dev"
            # OIDC SSO via JellyfinSecurity plugin (Authentik)
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /media
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
              gpu.intel.com/xe: "1"
            limits:
              gpu.intel.com/xe: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          # No special security context needed - Intel GPU Device Plugin

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: cache
          emptyDir:
            # Local disk on purpose: HLS segments are a high-churn
            # create/write/unlink workload, so NFS (where /media lives) or a
            # replicated Longhorn volume would push every segment across the
            # network on top of the source read.
            #
            # Shares the node's 62Gi /var with container images, so this has to
            # stay well under the free space there -- overrunning it evicts the
            # pod mid-playback rather than failing the transcode. Throttling in
            # Terraform/apps/jellyfin.tf is what bounds a single stream.
            sizeLimit: 15Gi
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
