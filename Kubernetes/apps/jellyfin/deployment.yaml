apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
  labels:
    app: jellyfin
spec:
  # Matches the startup probe's budget, so a long first boot after a Jellyfin
  # upgrade does not mark the Deployment, and with it app-of-apps, Degraded.
  progressDeadlineSeconds: 3900
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # Resolve Authentik through Traefik locally instead of patching CoreDNS.
      hostAliases:
        - ip: 192.168.1.11
          hostnames:
            - auth.nerine.dev
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"

      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:12.1@sha256:78d3ea1207d1322471fcac39a614f004f2ccf7e878f95ab2977d752f07e4dd7e
          ports:
            - name: http
              containerPort: 8096
          env:
            - name: JELLYFIN_PublishedServerUrl
              value: "https://watch.nerine.dev"
            - name: TZ
              value: Europe/Warsaw
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /media
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              gpu.intel.com/xe: "1"
          # /health answers from Kestrel directly, so it stays 200 while a
          # plugin breaks every static asset. index.html passes through every
          # plugin startup filter (File Transformation, Jellyfin Enhanced), so
          # probing it catches that.
          # While migrations run, the setup server answers /health with 200
          # "Degraded" but /web/* with 503. The startup probe holds readiness
          # and liveness off for up to an hour, so a migration is never killed.
          startupProbe:
            httpGet:
              path: /web/index.html
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 360
          livenessProbe:
            httpGet:
              path: /web/index.html
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: cache
          emptyDir:
            sizeLimit: 15Gi
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
