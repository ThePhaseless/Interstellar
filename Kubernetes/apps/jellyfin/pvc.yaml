apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: media
  labels:
    backup.interstellar/enabled: "true"
  annotations:
    backup.interstellar/excludes: /jellyfin/metadata/library /jellyfin/data/subtitles /jellyfin/metadata/People /jellyfin/metadata/Studio /jellyfin/data/attachments /jellyfin/data/introskipper /jellyfin/image-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      # Holds all artwork and trickplay since they stopped being saved next to
      # the media (Terraform/apps/jellyfin.tf), plus the resized-image cache.
      storage: 20Gi
