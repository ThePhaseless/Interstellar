apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-ml
  namespace: utilities
  labels:
    app: immich-ml
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-ml
  template:
    metadata:
      labels:
        app: immich-ml
    spec:
      enableServiceLinks: false
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"

      containers:
        - name: immich-ml
          image: ghcr.io/immich-app/immich-machine-learning:v3.4.1-openvino@sha256:97f60b06c5938c326d3ba416bcf24bc94d233f34554c05f3b76336f98ffd5ea9
          env:
            - name: MACHINE_LEARNING_REQUEST_THREADS
              value: "1"
            - name: MACHINE_LEARNING_MODEL_INTRA_OP_THREADS
              value: "1"
            - name: MACHINE_LEARNING_MODEL_INTER_OP_THREADS
              value: "1"
            - name: MACHINE_LEARNING_MAX_BATCH_SIZE__FACIAL_RECOGNITION
              value: "4"
          ports:
            - name: http
              containerPort: 3003
          volumeMounts:
            - name: cache
              mountPath: /cache
          resources:
            requests:
              cpu: 100m
              memory: 4Gi
              gpu.intel.com/xe: "1"
            limits:
              cpu: 4000m
              memory: 8Gi
              gpu.intel.com/xe: "1"
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60

      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: immich-ml-local-cache
---
apiVersion: v1
kind: Service
metadata:
  name: immich-ml
  namespace: utilities
spec:
  ports:
    - name: http
      port: 3003
      targetPort: http
  selector:
    app: immich-ml
