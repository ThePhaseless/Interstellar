apiVersion: batch/v1
kind: CronJob
metadata:
  name: media-backup
  namespace: media
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 120
      # Under Forbid, one hung run silently blocks every later backup.
      activeDeadlineSeconds: 7200
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: media-backup
          restartPolicy: Never
          containers:
            - name: orchestrator
              image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
              command: ["/bin/sh", "/scripts/media-backup-orchestrator.sh"]
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              volumeMounts:
                - name: backup-script
                  mountPath: /scripts
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
          volumes:
            - name: backup-script
              configMap:
                name: media-backup-script
