general:
  log_level: INFO
  test_run: false
  timer: 10
  protected_tag: "dont_delete"

job_defaults:
  max_strikes: 3

jobs:
  # A transient storage fault errors a torrent rather than slowing it: ENOSPC
  # on a full branch, or ESTALE when a fileid changes under the NFS client.
  # Those episodes have lasted over two hours, and at the 30-minute default
  # both jobs delete a half-finished download and blocklist its release.
  # Timer is 10 minutes, so 18 strikes is three hours.
  remove_failed_downloads:
    max_strikes: 18
  remove_failed_imports:
  remove_metadata_missing:
  remove_missing_files:
    max_strikes: 18
  # Orphan detection diffs two separate queue reads, so one momentary misread
  # marks every in-progress download an orphan.
  remove_orphans:
    max_strikes: 3
  # A 50 GiB remux on a small swarm swings either side of min_speed for long
  # stretches; at the default 3 strikes it is deleted after 30 minutes and its
  # release blocklisted, burning a good source that would have finished.
  remove_slow:
    min_speed: 100
    max_strikes: 12
  remove_stalled:
    max_strikes: 9
  remove_unmonitored:

instances:
  sonarr:
    - base_url: "http://sonarr.media.svc.cluster.local:8989"
      api_key: !ENV SONARR_API_KEY

  radarr:
    - base_url: "http://radarr.media.svc.cluster.local:7878"
      api_key: !ENV RADARR_API_KEY

download_clients:
  qbittorrent:
    - base_url: "http://qbittorrent.media.svc.cluster.local:8080"
