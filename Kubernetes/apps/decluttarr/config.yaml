general:
  timer: 10
  protected_tag: "dont_delete"

jobs:
  # Storage faults (ENOSPC on a full branch, ESTALE from the NFS client) error
  # torrents for over two hours, and without max_strikes these jobs delete on
  # first sight. 18 strikes on the 10-minute timer is three hours.
  remove_failed_downloads:
    max_strikes: 18
  remove_failed_imports:
  remove_metadata_missing:
  remove_missing_files:
    max_strikes: 18
  # Orphan detection diffs two separate queue reads, so one momentary misread
  # marks every in-progress download an orphan.
  remove_orphans:
    max_strikes: 3
  # A 50 GiB remux on a small swarm swings either side of min_speed for long
  # stretches; the default 3 strikes deletes and blocklists it after 30 minutes.
  remove_slow:
    max_strikes: 12
  remove_stalled:
    max_strikes: 9
  remove_unmonitored:

instances:
  sonarr:
    - base_url: "http://sonarr.media.svc.cluster.local:8989"
      api_key: !ENV SONARR_API_KEY

  radarr:
    - base_url: "http://radarr.media.svc.cluster.local:7878"
      api_key: !ENV RADARR_API_KEY

download_clients:
  qbittorrent:
    - base_url: "http://qbittorrent.media.svc.cluster.local:8080"
