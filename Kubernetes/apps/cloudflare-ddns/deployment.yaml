apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ddns
  namespace: utilities
  labels:
    app: cloudflare-ddns
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cloudflare-ddns
  template:
    metadata:
      labels:
        app: cloudflare-ddns
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: cloudflare-ddns
          image: favonia/cloudflare-ddns:1.17.1
          env:
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-token
                  key: api-token
            - name: IP4_DOMAINS
              value: "nerine.dev,*.nerine.dev"
            - name: IP6_PROVIDER
              value: "none"
            - name: TTL
              value: "60"
            # Must match the comment Terraform seeds the records with, or every
            # run logs a mismatch warning.
            - name: RECORD_COMMENT
              value: "Home Traefik ingress - value maintained by cloudflare-ddns"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
