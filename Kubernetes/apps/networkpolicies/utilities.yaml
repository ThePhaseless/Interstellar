---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: utilities
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik
  namespace: utilities
spec:
  policyTypes: [Ingress]
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [copyparty, immich]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        # NetworkPolicy matches the destination POD port, not the Service port.
        # immich's Service publishes 3001 but the container listens on 2283, so
        # allowing 3001 dropped every request Traefik made and photos.nerine.dev
        # returned 504. Keep these in sync with containerPort, not servicePort.
        - {protocol: TCP, port: 3923} # copyparty
        - {protocol: TCP, port: 2283} # immich
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-immich-internal
  namespace: utilities
spec:
  policyTypes: [Ingress]
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [immich, immich-ml]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [immich, immich-ml]
      ports:
        - {protocol: TCP, port: 3003}
        - {protocol: TCP, port: 5432}
    # The nightly CronJob dumps the Immich database before archiving it.
    # Its pod is labelled app.kubernetes.io/name, not app.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: borgbackup
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postfix-senders
  namespace: utilities
spec:
  policyTypes: [Ingress]
  podSelector:
    matchLabels:
      app: postfix
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: utilities
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - {protocol: TCP, port: 587}
