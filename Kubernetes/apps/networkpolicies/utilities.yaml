---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: utilities
spec:
  podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik
  namespace: utilities
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [copyparty, immich]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        # Container ports, not Service ports: immich's Service publishes 3001.
        - {port: 3923} # copyparty
        - {port: 2283} # immich
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-immich-internal
  namespace: utilities
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [immich, immich-ml]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [immich, immich-ml]
      ports:
        - {port: 3003}
        - {port: 5432}
    # borgbackup's pod is labelled app.kubernetes.io/name, not app.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: borgbackup
      ports:
        - {port: 5432}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postfix-senders
  namespace: utilities
spec:
  podSelector:
    matchLabels:
      app: postfix
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: utilities
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - {port: 587}
