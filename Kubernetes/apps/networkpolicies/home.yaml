---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: home
spec:
  podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik
  namespace: home
# AdGuard has no login (adguard/scripts/disable-admin-auth.sh); only Traefik,
# which applies Authentik forward-auth, may reach its admin UI.
spec:
  podSelector:
    matchLabels:
      app: adguard
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - {port: 3000}
---
# No `from`: LAN clients reach DNS via MetalLB with their own IPs, which no pod
# or namespace selector can match.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: home
spec:
  podSelector:
    matchLabels:
      app: adguard
  ingress:
    - ports:
        - {protocol: UDP, port: 53}
        - {port: 53}
