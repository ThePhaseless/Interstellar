---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: home
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik
  namespace: home
# AdGuard has no login of its own (see adguard/disable-admin-auth.sh), so this
# policy is the only thing standing between a pod and DNS admin. Traefik is the
# sole allowed source because it is what applies the Authentik forward-auth.
spec:
  policyTypes: [Ingress]
  podSelector:
    matchLabels:
      app: adguard
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - {protocol: TCP, port: 3000}
---
# DNS reaches AdGuard from LAN and tailnet clients through MetalLB and the
# Tailscale proxy, so the source is outside the pod network entirely.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: home
spec:
  policyTypes: [Ingress]
  podSelector:
    matchLabels:
      app: adguard
  ingress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
