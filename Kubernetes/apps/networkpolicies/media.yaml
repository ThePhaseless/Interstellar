---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: media
spec:
  podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik
  namespace: media
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [sonarr, radarr, prowlarr, bazarr, seerr, jellyfin, qbittorrent]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - {port: 8989}
        - {port: 7878}
        - {port: 9696}
        - {port: 6767}
        - {port: 5055}
        - {port: 8096}
        - {port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-arr-consumers
  namespace: media
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [sonarr, radarr]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [seerr, bazarr, decluttarr, recyclarr, prowlarr, arr-coverage-search]
      ports:
        - {port: 8989}
        - {port: 7878}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prowlarr-from-arr
  namespace: media
spec:
  podSelector:
    matchLabels:
      app: prowlarr
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [sonarr, radarr, arr-coverage-search]
      ports:
        - {port: 9696}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-qbittorrent-from-arr
  namespace: media
spec:
  podSelector:
    matchLabels:
      app: qbittorrent
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [sonarr, radarr, decluttarr]
      ports:
        - {port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-byparr-from-indexers
  namespace: media
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [byparr, byparr-proxy, byparr-proxy-eztv]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [prowlarr, sonarr, radarr, byparr-proxy, byparr-proxy-eztv]
      ports:
        - {port: 8191}
        - {port: 8888}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-jellyfin-from-media-apps
  namespace: media
spec:
  podSelector:
    matchLabels:
      app: jellyfin
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [seerr, sonarr, radarr]
      ports:
        - {port: 8096}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-seerr-from-jellyfin
  namespace: media
spec:
  podSelector:
    matchLabels:
      app: seerr
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: jellyfin
      ports:
        - {port: 5055}
