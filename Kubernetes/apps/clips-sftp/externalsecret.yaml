apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clips-sftp-tailscale
  namespace: utilities
spec:
  secretStoreRef:
    name: bitwarden-store-generated
    kind: ClusterSecretStore
  target:
    name: clips-sftp-tailscale
  data:
    - secretKey: authkey
      remoteRef:
        key: tailscale-files-auth-key
