# No API token for a compromised container to steal; workloads that need one
# (arr-configurator, media-backup, home-backup) bring their own ServiceAccount.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: media
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: utilities
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: home
automountServiceAccountToken: false
