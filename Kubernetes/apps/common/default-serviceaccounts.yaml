# Workloads in these namespaces do not call the Kubernetes API; the ones that
# do (arr-configurator, media-backup, home-backup) carry their own accounts.
# Disabling automount here means a compromised container holds no API
# credential, and any future workload needing one must ask for it explicitly.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: media
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: utilities
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: home
automountServiceAccountToken: false
