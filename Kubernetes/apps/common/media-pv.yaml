---
# Torrent download staging - media namespace.
# Incomplete torrents write out-of-order pieces across dozens of files at once.
# On the RAIDZ1 HDDs that pattern measured 32-37 ms await and kept libtorrent's
# write queue full, which throttles every peer at once. This is a separate NVMe
# pool so only completed files land on the spindles, as one sequential move.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: downloads-ssd-nfs-pv
spec:
  capacity:
    storage: 231Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.2
    - noatime
  nfs:
    server: REPLACED_BY_KUSTOMIZE
    path: /ssdstage/downloads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: downloads-ssd-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: downloads-ssd-nfs-pv
  resources:
    requests:
      storage: 231Gi
