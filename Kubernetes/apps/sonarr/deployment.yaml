apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: media
  annotations:
    ignore-check.kube-linter.io/latest-tag: "bitnami/kubectl versioned tags are not currently published; keep latest for this helper sidecar."
    reloader.stakater.com/auto: "true"
  labels:
    app: sonarr
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9707"
    spec:
      serviceAccountName: arr-configurator

      initContainers:
        - name: set-external-auth
          image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: ["/bin/sh", "-c"]
          args:
            - |
              CONFIG="/config/config.xml"
              ALLOWED_HOSTS="sonarr,sonarr.media,sonarr.media.svc,sonarr.media.svc.cluster.local,sonarr.nerine.dev"
              if [ ! -f "$CONFIG" ]; then
                printf '<Config>\n  <AuthenticationMethod>External</AuthenticationMethod>\n  <AuthenticationRequired>DisabledForLocalAddresses</AuthenticationRequired>\n  <AllowedHosts>%s</AllowedHosts>\n</Config>\n' "$ALLOWED_HOSTS" > "$CONFIG"
                echo "Created config.xml with External auth"
              else
                sed -i 's|<AuthenticationMethod>[^<]*</AuthenticationMethod>|<AuthenticationMethod>External</AuthenticationMethod>|' "$CONFIG"
                sed -i 's|<AuthenticationRequired>[^<]*</AuthenticationRequired>|<AuthenticationRequired>DisabledForLocalAddresses</AuthenticationRequired>|' "$CONFIG"
                if grep -q '<AllowedHosts>' "$CONFIG"; then
                  sed -i "s|<AllowedHosts>[^<]*</AllowedHosts>|<AllowedHosts>$ALLOWED_HOSTS</AllowedHosts>|" "$CONFIG"
                else
                  sed -i "s|</Config>|  <AllowedHosts>$ALLOWED_HOSTS</AllowedHosts>\n</Config>|" "$CONFIG"
                fi
                echo "Updated config.xml auth settings"
              fi
          volumeMounts:
            - name: config
              mountPath: /config

      containers:
        - name: sonarr
          image: linuxserver/sonarr:4.0.20@sha256:673dc4609a5672bc8e46069c86ffcea283a86b48d34a6c93d8da8c24a1b87571
          envFrom:
            - configMapRef:
                name: media-runtime-config
          ports:
            - name: http
              containerPort: 8989
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
            - name: media
              mountPath: /media
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              # Spikes past 1Gi during large searches, and a cgroup OOM kills the whole s6 container.
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /ping
              port: http
              # AllowedHosts rejects the pod IP that the kubelet sends as Host.
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 30

        - name: api-extractor
          image: bitnami/kubectl:latest@sha256:8919c149c2e3d6860e0143c117900e64d71395172aaef0e01e604bb98c8e7ce0
          imagePullPolicy: IfNotPresent
          command:
            [
              "/bin/bash",
              "/scripts/extract-api-key.sh",
              "sonarr",
              "/config/config.xml",
            ]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi

        - name: exportarr
          image: ghcr.io/onedr0p/exportarr:v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
          args: ["sonarr"]
          env:
            - name: PORT
              value: "9707"
            - name: URL
              value: "http://localhost:8989"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: arr-api-keys
                  key: sonarr-api-key
          ports:
            - name: metrics
              containerPort: 9707
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config
        - name: scripts
          configMap:
            name: arr-scripts
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads-pool-pvc
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
