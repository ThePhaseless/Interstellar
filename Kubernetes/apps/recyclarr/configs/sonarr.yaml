# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/master/schemas/config-schema.json

sonarr:
  series:
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true

    quality_definition:
      type: series

    media_naming:
      series: jellyfin-tvdb
      season: default
      episodes:
        rename: true
        standard: default
        anime: default
        daily: default

    quality_profiles:
      - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7 # WEB-2160p (Combined)
        reset_unmatched_scores:
          enabled: true
        # Best-first preference; lower qualities stay allowed as fallbacks so
        # old/niche shows with limited availability still get grabbed.
        min_format_score: -1000000
        qualities:
          - name: Bluray-2160p Remux
          - name: Bluray-2160p
          - name: WEBRip-2160p
          - name: WEBDL-2160p
          - name: Bluray-1080p Remux
          - name: Bluray-1080p
          - name: WEBRip-1080p
          - name: WEBDL-1080p
          - name: HDTV-2160p
          - name: Bluray-720p
          - name: WEBRip-720p
          - name: WEBDL-720p
          - name: HDTV-720p
          - name: Bluray-576p
          - name: Bluray-480p
          - name: WEBRip-480p
          - name: WEBDL-480p
          - name: DVD
          - name: SDTV
        upgrade:
          allowed: true
          until_quality: Bluray-2160p Remux
      - trash_id: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
        reset_unmatched_scores:
          enabled: true
        # Large negative (override guide's 100): never filter out niche/old
        # anime with limited release quality; negative CFs only rank lower.
        min_format_score: -1000000
        # Full guide quality set (guide allows down to SDTV because anime
        # availability is limited), best-first.
        qualities:
          - name: Bluray-1080p Remux
          - name: Bluray-1080p
          - name: HDTV-1080p
          - name: WEBRip-1080p
          - name: WEBDL-1080p
          - name: Bluray-720p
          - name: HDTV-720p
          - name: WEBRip-720p
          - name: WEBDL-720p
          - name: Bluray-480p
          - name: WEBRip-480p
          - name: WEBDL-480p
          - name: DVD
          - name: SDTV
        upgrade:
          allowed: true
          until_quality: Bluray-1080p Remux

    custom_formats:
      # The anime profile scores no repack CFs, so with Sonarr's
      # downloadPropersAndRepacks set to doNotPrefer (Terraform/apps/servarr.tf)
      # a proper would carry no preference at all there.
      - trash_ids:
          - ec8fa7296b64e8cd390a1600981f3923 # Repack/Proper
        assign_scores_to:
          - trash_id: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
            score: 5
      - trash_ids:
          - eb3d5cc0a2be0db205fb823640db6a3c # Repack2
        assign_scores_to:
          - trash_id: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
            score: 6
      - trash_ids:
          - 44e7c4de10ae50265753082e5dc76047 # Repack3
        assign_scores_to:
          - trash_id: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
            score: 7
      # Hard ban, not a penalty: this sits below min_format_score (-1000000),
      # so an upscaled release is rejected outright instead of being
      # outranked. The guide's own -10000 only demotes it, and the anime
      # profile does not score it at all.
      - trash_ids:
          - 23297a736ca77c0fc8e70f8edd7ee56c # Upscaled
        assign_scores_to:
          - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7 # WEB-2160p (Combined)
            score: -10000000
          - trash_id: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
            score: -10000000

    custom_format_groups:
      add:
        - trash_id: e3f37512790f00d0e89e54fe5e790d1c # [Required] Golden Rule UHD
        - trash_id: d920fd959d220306888f40b6f38e1578 # [Optional] Season Packs
        - trash_id: 35fb4585dcd9e2a5ac732e4309f5a45a # [Streaming Services] Asian
        - trash_id: f4a0410a1df109a66d6e47dcadcce014 # [Optional] Miscellaneous
          select:
            - ef4963043b0987f8485bc9106f16db38 # DV (Disk)
            - 1bd69272e23c5e6c5b1d6c8a36fce95e # HFR
            - 7ba05c6e0e14e793538174c679126996 # MULTi
            - 7470a681e6205243983c4410ee4c920f # VC-1
            - 90501962793d580d011511155c97e4e5 # VP9
            - cddfb4e32db826151d97352b8e37c648 # x264
            - c9eafd50846d299b862ca9bb6ea91950 # x265
            - 041d90b435ebd773271cea047a457a6a # x266
        - trash_id: e1053c0ef622df3749fa43c22865663a # [Optional] SDR
          select:
            - 83304f261cf516bb208c18c54c0adf97 # SDR (no WEBDL)
