apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: printing

resources:
  - serviceaccount.yaml
  - role.yaml
  - rolebinding.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - middleware.yaml
  - admission-policy.yaml

labels:
  - pairs:
      app: pagewire
    includeSelectors: true
