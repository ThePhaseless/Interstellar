apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: home

resources:
  - deployment.yaml
  - service.yaml
  - service-tailscale.yaml
  - ingress.yaml
  - pvc.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: adguard-scripts
    namespace: home
    files:
      - scripts/disable-admin-auth.sh

labels:
  - pairs:
      app: adguard
    includeSelectors: true
