apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard
  namespace: home
  labels:
    app: adguard
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: adguard
  template:
    metadata:
      labels:
        app: adguard
    spec:
      # Schedule on specific node for stable DNS IP via MetalLB
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""

      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      initContainers:
        - name: disable-admin-auth
          image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command: ["/bin/sh", "/scripts/disable-admin-auth.sh"]
          volumeMounts:
            - name: data
              mountPath: /opt/adguardhome/conf
              subPath: conf
            - name: scripts
              mountPath: /scripts
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault

      containers:
        - name: adguard
          image: adguard/adguardhome:v0.107.79
          env:
            - name: TZ
              value: "UTC"
          ports:
            - name: http
              containerPort: 3000
            - name: dns-tcp
              containerPort: 53
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-https
              containerPort: 443
            - name: dns-tls
              containerPort: 853
          volumeMounts:
            - name: data
              mountPath: /opt/adguardhome/conf
              subPath: conf
            - name: data
              mountPath: /opt/adguardhome/work
              subPath: work
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - NET_RAW

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: adguard-data
        - name: scripts
          configMap:
            name: adguard-scripts
            defaultMode: 0555
