apiVersion: v1
kind: Service
metadata:
  name: adguard-tailscale
  namespace: home
  labels:
    app: adguard
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "adguard"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: adguard
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
  # Deliberately DNS-only: a web port here would put the admin UI on the
  # tailnet without Authentik forward-auth in front of it.
