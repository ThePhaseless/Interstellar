---
apiVersion: v1
kind: Namespace
metadata:
  name: media
  labels:
    name: media
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: utilities
  labels:
    name: utilities
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: home
  labels:
    name: home
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-memory-request
  namespace: media
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-memory-request
  namespace: utilities
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-memory-request
  namespace: home
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
