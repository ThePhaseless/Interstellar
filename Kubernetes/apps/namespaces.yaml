---
apiVersion: v1
kind: Namespace
metadata:
  name: media
  labels:
    name: media
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: utilities
  labels:
    name: utilities
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: home
  labels:
    name: home
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Privileged only for the device pod's hostNetwork (mDNS and the IPP and eSCL ports on
# the node's LAN IP). Kubernetes/apps/pagewire/admission-policy.yaml refuses privileged
# containers, hostPath, hostPID/IPC, added capabilities, privilege escalation and
# Unconfined seccomp or AppArmor here, and makes every container drop ALL capabilities.
apiVersion: v1
kind: Namespace
metadata:
  name: printing
  labels:
    name: printing
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
