apiVersion: apps/v1
kind: Deployment
metadata:
  name: c-oop
  namespace: utilities
  labels:
    app: c-oop
spec:
  # One replica: browsers of a room find each other through the signaling
  # relay, which lives in this process's memory.
  replicas: 1
  selector:
    matchLabels:
      app: c-oop
  template:
    metadata:
      labels:
        app: c-oop
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: c-oop
          image: ghcr.io/thephaseless/c-oop:1.0.1@sha256:a1b6069a83f0dc3ac6968d57bf418881975228bae36d87e5a4cb75c57c4d8aa6
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          # Traefik keeps sending to the old pod for a moment after it is told to stop.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
