apiVersion: v1
kind: Namespace
metadata:
  name: crowdsec
  labels:
    name: crowdsec
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-memory-request
  namespace: crowdsec
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
