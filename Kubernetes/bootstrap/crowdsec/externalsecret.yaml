apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-secrets
  namespace: crowdsec
spec:
  secretStoreRef:
    name: bitwarden-store-generated
    kind: ClusterSecretStore
  target:
    name: crowdsec-secrets
    creationPolicy: Owner
  data:
    - secretKey: BOUNCER_KEY_traefik
      remoteRef:
        key: crowdsec-api-key

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-lapi-secrets
  namespace: crowdsec
spec:
  secretStoreRef:
    name: bitwarden-store-generated
    kind: ClusterSecretStore
  target:
    name: crowdsec-lapi-secrets
    creationPolicy: Owner
  data:
    - secretKey: csLapiSecret
      remoteRef:
        key: crowdsec-lapi-secret
    - secretKey: registrationToken
      remoteRef:
        key: crowdsec-lapi-registration-token
