apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-web-ui-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-store-generated
    kind: ClusterSecretStore
  target:
    name: crowdsec-web-ui-secrets
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: crowdsec-web-ui-password
