apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: crowdsec

resources:
  - namespace.yaml
  - externalsecret.yaml
  - backup-externalsecret.yaml
  - backup-cronjob.yaml

helmCharts:
  - name: crowdsec
    repo: https://crowdsecurity.github.io/helm-charts
    version: 0.24.2
    releaseName: crowdsec
    namespace: crowdsec
    valuesFile: values.yaml

# CrowdSec chart omits metadata.namespace — kustomize namespace transformer
# doesn't apply to Helm output in v5.8.1, so add namespace via patches.
patches:
  - path: backup-common.yaml
    target:
      kind: CronJob
      labelSelector: backup=borg
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /metadata/namespace
        value: crowdsec
  - target:
      kind: DaemonSet
    patch: |-
      - op: add
        path: /metadata/namespace
        value: crowdsec
  - target:
      kind: Service
    patch: |-
      - op: add
        path: /metadata/namespace
        value: crowdsec
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: add
        path: /metadata/namespace
        value: crowdsec
  - target:
      kind: ConfigMap
    patch: |-
      - op: add
        path: /metadata/namespace
        value: crowdsec
  - target:
      kind: Secret
    patch: |-
      - op: add
        path: /metadata/namespace
        value: crowdsec

configMapGenerator:
  - name: crowdsec-backup-script
    files:
      - scripts/borg-backup.sh
    options:
      disableNameSuffixHash: true
