apiVersion: v1
kind: Namespace
metadata:
  name: reloader
  labels:
    name: reloader
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-memory-request
  namespace: reloader
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
