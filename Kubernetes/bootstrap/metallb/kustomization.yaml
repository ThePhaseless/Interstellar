apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: metallb-system

resources:
  - namespace.yaml
  - ipaddresspool.yaml
  - l2advertisement.yaml

helmCharts:
  - name: metallb
    repo: https://metallb.github.io/metallb
    version: 0.16.1
    releaseName: metallb
    namespace: metallb-system
    includeCRDs: true
    valuesInline:
      prometheus:
        serviceMonitor:
          enabled: false
      frr-k8s:
        prometheus:
          serviceMonitor:
            enabled: false
      speaker:
        ignoreExcludeLB: true
