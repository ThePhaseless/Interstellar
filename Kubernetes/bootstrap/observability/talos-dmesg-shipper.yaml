apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: talos-kmsg-shipper
  namespace: observability
  labels:
    app: talos-kmsg-shipper
spec:
  selector:
    matchLabels:
      app: talos-kmsg-shipper
  template:
    metadata:
      labels:
        app: talos-kmsg-shipper
        source: talos-kmsg
    spec:
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
      containers:
        - name: kmsg
          image: alpine:3.24
          command:
            - sh
            - -c
            - |
              # cat never hits EOF on /dev/kmsg and starts from the oldest record,
              # so every pod start re-ships the whole ring buffer once.
              exec cat /dev/kmsg
          securityContext:
            # Talos' SELinux policy allows no container_t -> device_t
            # transition to /dev/kmsg, not even with CAP_SYSLOG, and spc_t is
            # restricted to static pods as of v1.13.4 — privileged is the only
            # path that works. Do NOT add `capabilities.drop: [ALL]`: it strips
            # the implicit-privilege bit and the cat fails with EPERM.
            # allowPrivilegeEscalation cannot be false while privileged is true.
            privileged: true
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: kmsg
              mountPath: /dev/kmsg
              readOnly: true
      volumes:
        - name: kmsg
          hostPath:
            path: /dev/kmsg
            type: CharDevice
