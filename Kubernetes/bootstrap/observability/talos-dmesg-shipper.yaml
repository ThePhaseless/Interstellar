apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: talos-kmsg-shipper
  namespace: observability
  labels:
    app: talos-kmsg-shipper
  # kube-linter's privileged-container and privilege-escalation-container
  # checks are excluded globally in .kube-linter.yaml.
spec:
  selector:
    matchLabels:
      app: talos-kmsg-shipper
  template:
    metadata:
      labels:
        app: talos-kmsg-shipper
        source: talos-kmsg
    spec:
      # Run on every node, control-plane nodes (NoSchedule) included.
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
      containers:
        - name: kmsg
          image: alpine:3.24
          command:
            - sh
            - -c
            - |
              # cat blocks on /dev/kmsg and is woken per kernel line; stdout is
              # picked up by Promtail's kubernetes-pods job. The first read
              # dumps the whole ring buffer, so every pod start bursts once.
              exec cat /dev/kmsg
          securityContext:
            # Talos' SELinux policy allows no container_t -> device_t
            # transition to /dev/kmsg, not even with CAP_SYSLOG, and spc_t is
            # restricted to static pods as of v1.13.4 — privileged is the only
            # path that works. Do NOT add `capabilities.drop: [ALL]`: it strips
            # the implicit-privilege bit and the cat fails with EPERM.
            # allowPrivilegeEscalation cannot be false while privileged is true.
            privileged: true
            runAsUser: 0
            readOnlyRootFilesystem: true
          resources:
            requests:
              # Idle CPU is near 0; it bursts only on a new kernel line.
              cpu: 5m
              # Enough to buffer a few seconds of dmesg burst (boot, crash dump).
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: kmsg
              mountPath: /dev/kmsg
              readOnly: true
      volumes:
        - name: kmsg
          hostPath:
            path: /dev/kmsg
            type: CharDevice
