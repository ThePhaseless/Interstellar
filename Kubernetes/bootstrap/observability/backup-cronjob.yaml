apiVersion: batch/v1
kind: CronJob
metadata:
  name: mimir-backup
  namespace: observability
  labels:
    backup: borg
spec:
  schedule: "30 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: mimir
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: borgbackup
              image: alpine:3.24
              env:
                - name: BORG_BACKUP_TARGETS
                  value: |
                    observability-mimir:/data
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: mimir-data
---
