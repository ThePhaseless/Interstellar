auth_enabled: false

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  reject_old_samples: false
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  retention_stream:
    - selector: '{log_level="info"}'
      priority: 1
      period: 48h
    - selector: '{log_level="debug"}'
      priority: 2
      period: 48h

compactor:
  retention_enabled: true
  delete_request_store: filesystem

pattern_ingester:
  enabled: true
