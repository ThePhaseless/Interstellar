apiVersion: 1
groups:
  - orgId: 1
    name: Infrastructure Alerts
    folder: Alerts
    interval: 1m
    rules:
      # No data means no problem here, and severity critical also sends email.
      # The query already filters > 80, so threshold gt:0 fires on any series.
      - uid: high-cpu
        title: High CPU Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "CPU usage on {{ with $labels.instance }}{{ reReplaceAll \":[0-9]+$\" \"\" . }}{{ end }} is at {{ with $values.B }}{{ if and (eq .Value .Value) (gt .Value 0.0) }}{{ printf \"%.1f\" .Value }}{{ end }}{{ end }}% (threshold: 80%)"
        labels:
          severity: critical
        isPaused: false

      # No data means no problem here, and severity critical also sends email.
      - uid: high-memory
        title: High Memory Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Memory usage on {{ with $labels.instance }}{{ reReplaceAll \":[0-9]+$\" \"\" . }}{{ end }} is at {{ with $values.B }}{{ if and (eq .Value .Value) (gt .Value 0.0) }}{{ printf \"%.1f\" .Value }}{{ end }}{{ end }}% (threshold: 85%)"
        labels:
          severity: critical
        isPaused: false

      # Any restart in 10m is abnormal here, so this is > 0 rather than > 5.
      # It deliberately catches the crash-and-recover case that never reaches
      # CrashLoopBackOff; the sustained case is covered by pod-crashloopbackoff
      # below. Keep this at warning so a single transient restart does not page.
      - uid: pod-crashloop
        title: Container Restarting
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              expr: increase(kube_pod_container_status_restarts_total[10m]) > 0
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} restarted {{ with $values.B }}{{ if and (eq .Value .Value) (gt .Value 0.0) }}{{ printf \"%.0f\" .Value }}{{ end }}{{ end }} times in 10m"
        labels:
          severity: warning
        isPaused: false

      # "Restarted recently AND currently not ready" is the durable signal for a
      # pod that cannot stay up. Deliberately NOT built on
      # kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}:
      # that series only exists during the backoff window, a crashing container
      # alternates between terminated and waiting, and it was verified absent
      # from Mimir even while a pod was actively crash-looping.
      # The `and on(namespace,pod)` is what keeps completed Job pods out — they
      # are not ready but never restart.
      # This catches the case the restart-rate alert alone misses: once kubelet
      # backoff reaches its 5m cap a crashing container only accrues ~2 restarts
      # per 10m, so a rate threshold goes quiet precisely when it is most broken.
      - uid: pod-crashloopbackoff
        title: Pod Crash Looping
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              expr: |
                max by (namespace, pod) (increase(kube_pod_container_status_restarts_total[15m])) > 0
                and on(namespace, pod)
                (max by (namespace, pod) (kube_pod_status_ready{condition="true"}) == 0)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping - it restarted recently and is still not ready"
        labels:
          severity: critical
        isPaused: false

      # The kube_pod_owner join excludes Job-owned pods.
      # Uses `== bool 0` so not-ready pods evaluate to 1 and threshold `gt:0` works.
      - uid: pod-not-ready
        title: Pod Not Ready
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              expr: |
                ((kube_pod_status_ready{condition="true"} == bool 0)
                * on(pod, namespace) group_left(owner_kind)
                kube_pod_owner{owner_kind=~"ReplicaSet|StatefulSet|DaemonSet"}
                * on(pod, namespace) group_left()
                (kube_pod_status_phase{phase="Pending"} == 1 or kube_pod_status_phase{phase="Running"} == 1))
                unless on(pod, namespace)
                (max by(pod, namespace) (kube_pod_container_status_waiting_reason{reason=~"ContainerCreating|ImagePullBackOff|ErrImagePull"}))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.owner_kind }}) is not ready
        labels:
          severity: warning
        isPaused: false

      # No data means no problem here. The query already filters > 85%, so
      # threshold gt:0 fires on any returned series.
      - uid: pvc-almost-full
        title: PVC Almost Full
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 85
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is at {{ with $values.B }}{{ if and (eq .Value .Value) (gt .Value 0.0) }}{{ printf \"%.1f\" .Value }}{{ end }}{{ end }}% capacity (threshold: 85%)"
        labels:
          severity: warning
        isPaused: false

      # Same `== 0` / threshold pairing as pod-not-ready.
      # noDataState Alerting: missing node metrics may mean the node is down.
      - uid: node-not-ready
        title: Node Not Ready
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              expr: kube_node_status_condition{condition="Ready",status="true"}
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: Node {{ $labels.node }} is not ready
        labels:
          severity: critical
        isPaused: false

      # A node that recovers inside Node Not Ready's 5m `for` never fires it, so
      # repeated short outages are otherwise invisible. 6h window, not 1h: these
      # arrive roughly hourly, so a 1h window sits under any threshold that
      # still ignores a single blip.
      - uid: node-flapping
        title: Node Flapping
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: mimir
            model:
              expr: changes(kube_node_status_condition{condition="Ready",status="true"}[6h]) > 2
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Node {{ $labels.node }} has flapped Ready repeatedly in the last 6 hours
        labels:
          severity: critical
        isPaused: false

      # noDataState OK: no cert-manager means no certs. The query returns
      # seconds remaining (positive), so threshold gt:0 fires correctly.
      - uid: cert-expiring
        title: Certificate Expiring Soon
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              expr: (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400 < 14
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: OK
        execErrState: Error
        for: 1h
        annotations:
          summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ with $values.B }}{{ if and (eq .Value .Value) (gt .Value 0.0) }}{{ printf \"%.1f\" .Value }}{{ end }}{{ end }} days"
        labels:
          severity: warning
        isPaused: false

      # `longhorn_disk_status` does not exist; disk schedulability is exposed as
      # `longhorn_node_status{condition="schedulable"}`. The raw metric is
      # queried, so the threshold is `lt:1` to fire on 0 (not schedulable).
      - uid: longhorn-disk-pressure
        title: Longhorn Disk Under Pressure
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              expr: longhorn_node_status{condition="schedulable"}
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Longhorn node {{ $labels.node }} is not schedulable (disk pressure)
        labels:
          severity: critical
        isPaused: false

      # Raw metric queried; threshold `gt:1` fires only for Degraded (2) and
      # Faulted (3), not Unknown (0) or Healthy (1).
      - uid: longhorn-volume-degraded
        title: Longhorn Volume Degraded
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              expr: longhorn_volume_robustness
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Longhorn volume {{ $labels.pvc }} in {{ $labels.pvc_namespace }} is {{ $labels.state }}
        labels:
          severity: warning
        isPaused: false

      # No data means no problem here, and severity critical also sends email.
      # The query returns ratio > 0.80, so threshold gt:0 fires correctly.
      - uid: longhorn-node-storage-high
        title: Longhorn Node Storage High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              expr: (longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes) * 100 > 80
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Longhorn node {{ $labels.node }} storage at {{ with $values.B }}{{ if and (eq .Value .Value) (gt .Value 0.0) }}{{ printf \"%.1f\" .Value }}{{ end }}{{ end }}% (threshold: 80%)"
        labels:
          severity: critical
        isPaused: false

      - uid: traefik-high-5xx-rate
        title: Traefik High 5xx Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              expr: |
                (
                  sum by(service) (rate(traefik_service_requests_total{code=~"5.."}[5m]))
                  /
                  clamp_min(sum by(service) (rate(traefik_service_requests_total[5m])), 0.001)
                ) * 100 > 5
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Traefik service {{ with $labels.service }}{{ reReplaceAll \"-[0-9a-f]+@kubernetescrd$\" \"\" . }}{{ end }} 5xx rate at {{ with $values.B }}{{ if and (eq .Value .Value) (gt .Value 0.0) }}{{ printf \"%.1f\" .Value }}{{ end }}{{ end }}% (threshold: 5%)"
        labels:
          severity: critical
        isPaused: false

      # Excludes services with inherently slow backend operations:
      #   - jellyfin: HLS streaming segments (2-3s per chunk) and WebSockets
      #   - bazarr: external subtitle provider API calls (1-5s)
      #   - sonarr/radarr/prowlarr: indexer queries and library scans
      #   - seerr: TMDb search API calls
      #   - authentik: OAuth flows and database queries
      #   - qbittorrent: torrent API operations
      - uid: traefik-high-p95-latency-warning
        title: Traefik High p95 Latency (Warning)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              expr: histogram_quantile(0.95, sum by (le, service) (rate(traefik_service_request_duration_seconds_bucket{service!~".*jellyfin.*|.*bazarr.*|.*sonarr.*|.*radarr.*|.*prowlarr.*|.*seerr.*|.*authentik.*|.*qbittorrent.*"}[5m]))) * 1000 > 750
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Traefik service {{ with $labels.service }}{{ reReplaceAll \"-[0-9a-f]+@kubernetescrd$\" \"\" . }}{{ end }} p95 latency at {{ with $values.B }}{{ if and (eq .Value .Value) (gt .Value 0.0) }}{{ printf \"%.0f\" .Value }}{{ end }}{{ end }}ms (threshold: 750ms)"
        labels:
          severity: warning
        isPaused: true

      # Excludes services with inherently slow backend operations – see the
      # warning alert for the full rationale.
      - uid: traefik-high-p95-latency-critical
        title: Traefik High p95 Latency (Critical)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              expr: histogram_quantile(0.95, sum by (le, service) (rate(traefik_service_request_duration_seconds_bucket{service!~".*jellyfin.*|.*bazarr.*|.*sonarr.*|.*radarr.*|.*prowlarr.*|.*seerr.*|.*authentik.*|.*qbittorrent.*"}[5m]))) * 1000 > 1500
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Traefik service {{ with $labels.service }}{{ reReplaceAll \"-[0-9a-f]+@kubernetescrd$\" \"\" . }}{{ end }} p95 latency at {{ with $values.B }}{{ if and (eq .Value .Value) (gt .Value 0.0) }}{{ printf \"%.0f\" .Value }}{{ end }}{{ end }}ms (threshold: 1500ms)"
        labels:
          severity: critical
        isPaused: true

      - uid: longhorn-volume-faulted
        title: Longhorn Volume Faulted
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: mimir
            model:
              expr: longhorn_volume_state{state="faulted"} == 1
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: Longhorn volume {{ $labels.pvc }} in {{ $labels.pvc_namespace }} is faulted
        labels:
          severity: critical
        isPaused: false

      - uid: longhorn-node-count-drop
        title: Longhorn Node Count Drop
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: mimir
            model:
              expr: max_over_time((min(longhorn_node_count_total))[24h:1m]) - min(longhorn_node_count_total)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              type: threshold
        dashboardUid: ""
        panelId: 0
        # NoData means the datasource is not answering, not that a
        # Longhorn node vanished.
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: Longhorn node count dropped below its 24h peak
        labels:
          severity: critical
        isPaused: false

      # Catches the app-visible symptom of broken PVCs before Kubernetes
      # readiness necessarily flips.
      - uid: pod-storage-io-errors
        title: Pod Storage I/O Errors
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              # longhorn-manager re-emits historical engine logs when instance
              # diagnostics are requested, so old error text arrives with a
              # current ingest time. Volume health is covered by the metric
              # based Longhorn rules instead.
              expr: 'sum by(namespace, pod) (count_over_time({namespace=~"media|utilities|home|longhorn-system", pod!~"longhorn-manager.*"} |~ "Read-only file system|Input/output error|I/O error" [5m]))'
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: range
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [3]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} logged {{ with $values.B }}{{ if and (eq .Value .Value) (gt .Value 0.0) }}{{ printf \"%.0f\" .Value }}{{ end }}{{ end }} storage I/O error lines in 5m"
        labels:
          severity: critical
        isPaused: false

      # Needs the explicit static-pod log scrape: on Talos these logs are not
      # captured by the generic pod job.
      - uid: apiserver-etcd-corrupt
        title: API Server etcd Corruption
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum(count_over_time({job="kube-system-static-pods", namespace="kube-system", component="kube-apiserver"} |= "etcdserver: corrupt cluster" [5m]))'
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: range
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: kube-apiserver is logging etcd corruption errors
        labels:
          severity: critical
        isPaused: false

contactPoints:
  - orgId: 1
    name: Discord
    receivers:
      - uid: discord-webhook
        type: discord
        settings:
          url: ${DISCORD_WEBHOOK_URL}
          message: '{{ template "discord_compact" . }}'
        disableResolveMessage: false
  - orgId: 1
    name: Email
    receivers:
      - uid: email-alerts
        type: email
        settings:
          addresses: admin@nerine.dev
          singleEmail: true
        disableResolveMessage: false

templates:
  - orgId: 1
    name: discord_compact
    template: |
      {{ define "discord_compact" -}}
      {{- if .Alerts.Firing -}}
      ## 🚨 {{ len .Alerts.Firing }} firing
      {{ range $i, $a := .Alerts.Firing -}}
      {{- if lt $i 10 }}
      {{- if eq (index $a.Labels "severity") "critical" }}🔴{{ else }}🟡{{ end }} **{{ index $a.Labels "alertname" }}**
      {{- if index $a.Annotations "Error" }}
      > ⚠️ Datasource query failed — check Mimir/Loki health
      {{- else }}
      > {{ index $a.Annotations "summary" }}
      {{- end }}
      -# {{ index $a.Labels "severity" }} · since {{ $a.StartsAt.Format "15:04 02 Jan" }} UTC{{ if $a.GeneratorURL }} · [Grafana]({{ $a.GeneratorURL }}){{ end }}{{ if $a.SilenceURL }} · [Silence]({{ $a.SilenceURL }}){{ end }}

      {{ end -}}
      {{- end -}}
      {{- if gt (len .Alerts.Firing) 10 -}}
      -# …showing 10 of {{ len .Alerts.Firing }} — see Grafana for the rest
      {{ end -}}
      {{- end -}}
      {{- if .Alerts.Resolved -}}
      ## ✅ {{ len .Alerts.Resolved }} resolved
      {{ range $i, $a := .Alerts.Resolved -}}
      {{- if lt $i 10 -}}
      🟢 **{{ index $a.Labels "alertname" }}**
      {{- if index $a.Annotations "Error" }}
      > Datasource error cleared
      {{- else }}
      > {{ index $a.Annotations "summary" }}
      {{- end }}
      {{ $d := $a.EndsAt.Sub $a.StartsAt -}}
      -# fired for {{ printf "%.0fs" $d.Seconds }} · ended {{ $a.EndsAt.Format "15:04 02 Jan" }} UTC

      {{ end -}}
      {{- end -}}
      {{- if gt (len .Alerts.Resolved) 10 -}}
      -# …showing 10 of {{ len .Alerts.Resolved }} — see Grafana for the rest
      {{ end -}}
      {{- end -}}
      {{- end }}

policies:
  - orgId: 1
    receiver: Discord
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # continue=true so Discord still gets the critical alerts too.
      - receiver: Email
        object_matchers:
          - ["severity", "=", "critical"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        continue: true
