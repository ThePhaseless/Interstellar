apiVersion: 1
groups:
  - name: Infrastructure Alerts
    folder: Alerts
    interval: 1m
    rules:
      # Pre-filtered to > 80: no data is healthy and gt:0 fires on any series.
      - uid: high-cpu
        title: High CPU Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
            datasourceUid: mimir
            model:
              expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "CPU usage on {{ with $labels.instance }}{{ reReplaceAll \":[0-9]+$\" \"\" . }}{{ end }} is at {{ with $values.B }}{{ if and (eq .Value .Value) (gt .Value 0.0) }}{{ printf \"%.1f\" .Value }}{{ end }}{{ end }}% (threshold: 80%)"
        labels:
          severity: critical

      - uid: high-memory
        title: High Memory Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
            datasourceUid: mimir
            model:
              expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Memory usage on {{ with $labels.instance }}{{ reReplaceAll \":[0-9]+$\" \"\" . }}{{ end }} is at {{ with $values.B }}{{ if and (eq .Value .Value) (gt .Value 0.0) }}{{ printf \"%.1f\" .Value }}{{ end }}{{ end }}% (threshold: 85%)"
        labels:
          severity: critical

      # Any restart is abnormal; pod-crashloopbackoff covers the sustained case.
      # Warning so a single transient restart does not page.
      - uid: pod-crashloop
        title: Container Restarting
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
            datasourceUid: mimir
            model:
              expr: increase(kube_pod_container_status_restarts_total[10m]) > 0
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} restarted {{ with $values.B }}{{ if and (eq .Value .Value) (gt .Value 0.0) }}{{ printf \"%.0f\" .Value }}{{ end }}{{ end }} times in 10m"
        labels:
          severity: warning

      # Not built on kube_pod_container_status_waiting_reason (CrashLoopBackOff):
      # that series exists only during each backoff window and was absent from
      # Mimir mid crash loop. Requiring a restart excludes completed Job pods.
      - uid: pod-crashloopbackoff
        title: Pod Crash Looping
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
            datasourceUid: mimir
            model:
              expr: |
                max by (namespace, pod) (increase(kube_pod_container_status_restarts_total[15m])) > 0
                and on(namespace, pod)
                (max by (namespace, pod) (kube_pod_status_ready{condition="true"}) == 0)
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping - it restarted recently and is still not ready"
        labels:
          severity: critical

      # Uses `== bool 0` so not-ready pods evaluate to 1 and threshold `gt:0` works.
      - uid: pod-not-ready
        title: Pod Not Ready
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
            datasourceUid: mimir
            model:
              expr: |
                ((kube_pod_status_ready{condition="true"} == bool 0)
                * on(pod, namespace) group_left(owner_kind)
                kube_pod_owner{owner_kind=~"ReplicaSet|StatefulSet|DaemonSet"}
                * on(pod, namespace) group_left()
                (kube_pod_status_phase{phase="Pending"} == 1 or kube_pod_status_phase{phase="Running"} == 1))
                unless on(pod, namespace)
                (max by(pod, namespace) (kube_pod_container_status_waiting_reason{reason=~"ContainerCreating|ImagePullBackOff|ErrImagePull"}))
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.owner_kind }}) is not ready
        labels:
          severity: warning

      # Pre-filtered to > 85%: no data is healthy and gt:0 fires on any series.
      - uid: pvc-almost-full
        title: PVC Almost Full
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
            datasourceUid: mimir
            model:
              expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 85
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is at {{ with $values.B }}{{ if and (eq .Value .Value) (gt .Value 0.0) }}{{ printf \"%.1f\" .Value }}{{ end }}{{ end }}% capacity (threshold: 85%)"
        labels:
          severity: warning

      # noDataState Alerting: missing node metrics may mean the node is down.
      - uid: node-not-ready
        title: Node Not Ready
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
            datasourceUid: mimir
            model:
              expr: kube_node_status_condition{condition="Ready",status="true"}
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
              expression: B
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: Node {{ $labels.node }} is not ready
        labels:
          severity: critical

      # Catches short outages that recover inside Node Not Ready's 5m `for`.
      # 6h so flaps an hour apart still exceed `> 2`. Keep relativeTimeRange
      # short: `> 2` drops healthy points, so `last` would latch onto old flaps.
      - uid: node-flapping
        title: Node Flapping
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
            datasourceUid: mimir
            model:
              expr: changes(kube_node_status_condition{condition="Ready",status="true"}[6h]) > 2
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Node {{ $labels.node }} has flapped Ready repeatedly in the last 6 hours
        labels:
          severity: critical

      # noDataState OK: no cert-manager means no series. The query returns days
      # remaining, so gt:0 fires for unexpired certs under 14 days.
      - uid: cert-expiring
        title: Certificate Expiring Soon
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
            datasourceUid: mimir
            model:
              expr: (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400 < 14
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1h
        annotations:
          summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ with $values.B }}{{ if and (eq .Value .Value) (gt .Value 0.0) }}{{ printf \"%.1f\" .Value }}{{ end }}{{ end }} days"
        labels:
          severity: warning

      # 36h is one missed daily run plus margin. Scoped by name rather than
      # all CronJobs: the suspended arr-coverage jobs have an arbitrarily old
      # last success and would fire forever.
      - uid: backup-stale
        title: Backup Not Succeeding
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
            datasourceUid: mimir
            model:
              expr: (time() - kube_cronjob_status_last_successful_time{cronjob=~".*backup.*"}) / 3600 > 36
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1h
        annotations:
          summary: "Backup {{ $labels.namespace }}/{{ $labels.cronjob }} has not succeeded in {{ with $values.B }}{{ printf \"%.0f\" .Value }}{{ end }}h"
        labels:
          severity: warning

      - uid: longhorn-disk-pressure
        title: Longhorn Disk Under Pressure
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
            datasourceUid: mimir
            model:
              expr: longhorn_node_status{condition="schedulable"}
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Longhorn node {{ $labels.node }} is not schedulable (disk pressure)
        labels:
          severity: critical

      # gt:1 fires only for Degraded (2) and Faulted (3), not Unknown (0) or Healthy (1).
      - uid: longhorn-volume-degraded
        title: Longhorn Volume Degraded
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
            datasourceUid: mimir
            model:
              expr: longhorn_volume_robustness
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [1]
                    type: gt
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Longhorn volume {{ $labels.pvc }} in {{ $labels.pvc_namespace }} is {{ $labels.state }}
        labels:
          severity: warning

      # Pre-filtered to > 80%: no data is healthy and gt:0 fires on any series.
      - uid: longhorn-node-storage-high
        title: Longhorn Node Storage High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
            datasourceUid: mimir
            model:
              expr: (longhorn_node_storage_usage_bytes / longhorn_node_storage_capacity_bytes) * 100 > 80
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Longhorn node {{ $labels.node }} storage at {{ with $values.B }}{{ if and (eq .Value .Value) (gt .Value 0.0) }}{{ printf \"%.1f\" .Value }}{{ end }}{{ end }}% (threshold: 80%)"
        labels:
          severity: critical

      - uid: traefik-high-5xx-rate
        title: Traefik High 5xx Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
            datasourceUid: mimir
            model:
              expr: |
                (
                  sum by(service) (rate(traefik_service_requests_total{code=~"5.."}[5m]))
                  /
                  clamp_min(sum by(service) (rate(traefik_service_requests_total[5m])), 0.001)
                ) * 100 > 5
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Traefik service {{ with $labels.service }}{{ reReplaceAll \"-[0-9a-f]+@kubernetescrd$\" \"\" . }}{{ end }} 5xx rate at {{ with $values.B }}{{ if and (eq .Value .Value) (gt .Value 0.0) }}{{ printf \"%.1f\" .Value }}{{ end }}{{ end }}% (threshold: 5%)"
        labels:
          severity: critical

      # Excluded services are slow by design: HLS streaming and WebSockets,
      # indexer, subtitle and TMDb lookups, OAuth flows, torrent API calls.
      - uid: traefik-high-p95-latency-warning
        title: Traefik High p95 Latency (Warning)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
            datasourceUid: mimir
            model:
              expr: histogram_quantile(0.95, sum by (le, service) (rate(traefik_service_request_duration_seconds_bucket{service!~".*jellyfin.*|.*bazarr.*|.*sonarr.*|.*radarr.*|.*prowlarr.*|.*seerr.*|.*authentik.*|.*qbittorrent.*"}[5m]))) * 1000 > 750
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Traefik service {{ with $labels.service }}{{ reReplaceAll \"-[0-9a-f]+@kubernetescrd$\" \"\" . }}{{ end }} p95 latency at {{ with $values.B }}{{ if and (eq .Value .Value) (gt .Value 0.0) }}{{ printf \"%.0f\" .Value }}{{ end }}{{ end }}ms (threshold: 750ms)"
        labels:
          severity: warning
        isPaused: true

      # Same exclusions as the warning rule.
      - uid: traefik-high-p95-latency-critical
        title: Traefik High p95 Latency (Critical)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
            datasourceUid: mimir
            model:
              expr: histogram_quantile(0.95, sum by (le, service) (rate(traefik_service_request_duration_seconds_bucket{service!~".*jellyfin.*|.*bazarr.*|.*sonarr.*|.*radarr.*|.*prowlarr.*|.*seerr.*|.*authentik.*|.*qbittorrent.*"}[5m]))) * 1000 > 1500
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Traefik service {{ with $labels.service }}{{ reReplaceAll \"-[0-9a-f]+@kubernetescrd$\" \"\" . }}{{ end }} p95 latency at {{ with $values.B }}{{ if and (eq .Value .Value) (gt .Value 0.0) }}{{ printf \"%.0f\" .Value }}{{ end }}{{ end }}ms (threshold: 1500ms)"
        labels:
          severity: critical
        isPaused: true

      - uid: longhorn-volume-faulted
        title: Longhorn Volume Faulted
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
            datasourceUid: mimir
            model:
              expr: longhorn_volume_state{state="faulted"} == 1
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: Longhorn volume {{ $labels.pvc }} in {{ $labels.pvc_namespace }} is faulted
        labels:
          severity: critical

      - uid: longhorn-node-count-drop
        title: Longhorn Node Count Drop
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
            datasourceUid: mimir
            model:
              expr: max_over_time((min(longhorn_node_count_total))[24h:1m]) - min(longhorn_node_count_total)
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        # NoData means the datasource is not answering, not that a
        # Longhorn node vanished.
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: Longhorn node count dropped below its 24h peak
        labels:
          severity: critical

      # Catches the app-visible symptom of broken PVCs before readiness flips.
      - uid: pod-storage-io-errors
        title: Pod Storage I/O Errors
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
            datasourceUid: loki
            model:
              # longhorn-manager re-emits old engine logs with a current ingest
              # time; the metric-based Longhorn rules cover volume health.
              expr: 'sum by(namespace, pod) (count_over_time({namespace=~"media|utilities|home|longhorn-system", pod!~"longhorn-manager.*"} |~ "Read-only file system|Input/output error|I/O error" [5m]))'
              queryType: range
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [3]
                    type: gt
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} logged {{ with $values.B }}{{ if and (eq .Value .Value) (gt .Value 0.0) }}{{ printf \"%.0f\" .Value }}{{ end }}{{ end }} storage I/O error lines in 5m"
        labels:
          severity: critical

      # Needs the explicit static-pod log scrape: on Talos these logs are not
      # captured by the generic pod job.
      - uid: apiserver-etcd-corrupt
        title: API Server etcd Corruption
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({job="kube-system-static-pods", namespace="kube-system", component="kube-apiserver"} |= "etcdserver: corrupt cluster" [5m]))'
              queryType: range
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              type: threshold
        noDataState: OK
        execErrState: Error
        annotations:
          summary: kube-apiserver is logging etcd corruption errors
        labels:
          severity: critical

contactPoints:
  - name: Discord
    receivers:
      - uid: discord-webhook
        type: discord
        settings:
          url: ${DISCORD_WEBHOOK_URL}
          message: '{{ template "discord_compact" . }}'
  - name: Email
    receivers:
      - uid: email-alerts
        type: email
        settings:
          addresses: admin@nerine.dev

templates:
  - name: discord_compact
    template: |
      {{ define "discord_compact" -}}
      {{- if .Alerts.Firing -}}
      ## 🚨 {{ len .Alerts.Firing }} firing
      {{ range $i, $a := .Alerts.Firing -}}
      {{- if lt $i 10 }}
      {{- if eq (index $a.Labels "severity") "critical" }}🔴{{ else }}🟡{{ end }} **{{ index $a.Labels "alertname" }}**
      {{- if index $a.Annotations "Error" }}
      > ⚠️ Datasource query failed — check Mimir/Loki health
      {{- else }}
      > {{ index $a.Annotations "summary" }}
      {{- end }}
      -# {{ index $a.Labels "severity" }} · since {{ $a.StartsAt.Format "15:04 02 Jan" }} UTC{{ if $a.GeneratorURL }} · [Grafana]({{ $a.GeneratorURL }}){{ end }}{{ if $a.SilenceURL }} · [Silence]({{ $a.SilenceURL }}){{ end }}

      {{ end -}}
      {{- end -}}
      {{- if gt (len .Alerts.Firing) 10 -}}
      -# …showing 10 of {{ len .Alerts.Firing }} — see Grafana for the rest
      {{ end -}}
      {{- end -}}
      {{- if .Alerts.Resolved -}}
      ## ✅ {{ len .Alerts.Resolved }} resolved
      {{ range $i, $a := .Alerts.Resolved -}}
      {{- if lt $i 10 -}}
      🟢 **{{ index $a.Labels "alertname" }}**
      {{- if index $a.Annotations "Error" }}
      > Datasource error cleared
      {{- else }}
      > {{ index $a.Annotations "summary" }}
      {{- end }}
      {{ $d := $a.EndsAt.Sub $a.StartsAt -}}
      -# fired for {{ printf "%.0fs" $d.Seconds }} · ended {{ $a.EndsAt.Format "15:04 02 Jan" }} UTC

      {{ end -}}
      {{- end -}}
      {{- if gt (len .Alerts.Resolved) 10 -}}
      -# …showing 10 of {{ len .Alerts.Resolved }} — see Grafana for the rest
      {{ end -}}
      {{- end -}}
      {{- end }}

policies:
  - receiver: Discord
    group_by:
      - grafana_folder
      - alertname
    routes:
      # continue=true so Discord still gets the critical alerts too.
      - receiver: Email
        object_matchers:
          - ["severity", "=", "critical"]
        repeat_interval: 12h
        continue: true
