# Alloy discovers the pods directly, so no Service is needed.
service:
  enabled: false

tolerations:
  - effect: NoSchedule
    operator: Exists
  - effect: NoExecute
    operator: Exists

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9100"

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

extraArgs:
  - --no-collector.btrfs
  - --no-collector.infiniband
  - --no-collector.ipvs
  - --no-collector.dmi
