# Alloy scrapes via pod annotation, not a ServiceMonitor.
kubeRBACProxy:
  enabled: false

# Alloy discovers the pods directly, so no Service is needed.
service:
  enabled: false

# Must run on control-plane nodes too.
tolerations:
  - effect: NoSchedule
    operator: Exists
  - effect: NoExecute
    operator: Exists

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9100"

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

# Disable collectors that don't exist on Talos VMs
extraArgs:
  - --no-collector.wifi
  - --no-collector.btrfs
  - --no-collector.infiniband
  - --no-collector.ipvs
  - --no-collector.dmi
