apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: longhorn-system

resources:
  - namespace.yaml
  - ingress.yaml
  - storageclass.yaml

helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.12.1
    releaseName: longhorn
    namespace: longhorn-system
    includeCRDs: true
    valuesInline:
      defaultSettings:
        defaultDataPath: /var/mnt/longhorn
        storageOverProvisioningPercentage: 100
        defaultReplicaCount: 2
        replicaAutoBalance: least-effort
        defaultDataLocality: best-effort
        # Reduce upgrade/rebuild blast radius to avoid cluster-wide IO storms.
        concurrentAutomaticEngineUpgradePerNodeLimit: 1
        concurrentReplicaRebuildPerNodeLimit: 2
        # The default, but keep it explicit: Longhorn never resets a Setting
        # whose key is dropped from this list, so omitting it pins any old value.
        engineReplicaTimeout: 8
      persistence:
        defaultDataLocality: best-effort

patches:
  - target:
      kind: Job
      name: longhorn-post-upgrade
    patch: |
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: longhorn-post-upgrade
  - target:
      kind: Job
      name: longhorn-pre-upgrade
    patch: |
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: longhorn-pre-upgrade
  - target:
      kind: Job
      name: longhorn-uninstall
    patch: |
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: longhorn-uninstall
