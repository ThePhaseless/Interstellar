apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: external-secrets

resources:
  - namespace.yaml
  - bitwarden-store.yaml
  - bitwarden-store-generated.yaml

# The bundled Bitwarden SDK subchart needs its TLS certs to exist before this
# is applied: ./scripts/generate-bitwarden-tls.sh
helmCharts:
  - name: external-secrets
    repo: https://charts.external-secrets.io
    version: 2.11.0
    releaseName: external-secrets
    namespace: external-secrets
    valuesInline:
      installCRDs: false
      replicaCount: 2
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 256Mi
      bitwarden-sdk-server:
        enabled: true
