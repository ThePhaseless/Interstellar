apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tailscale

resources:
  - namespace.yaml
  - externalsecret.yaml

helmCharts:
  - name: tailscale-operator
    repo: https://pkgs.tailscale.com/helmcharts
    version: 1.102.4
    releaseName: tailscale
    namespace: tailscale
    valuesInline:
      # Chart key is operatorConfig, not operator: Helm silently ignores unknown keys.
      operatorConfig:
        hostname: "talos-operator"
      apiServerProxyConfig:
        mode: "true"
      proxyConfig:
        defaultTags: "tag:service"
