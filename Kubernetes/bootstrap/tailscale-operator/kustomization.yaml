apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tailscale

resources:
  - namespace.yaml
  - externalsecret.yaml

helmCharts:
  - name: tailscale-operator
    repo: https://pkgs.tailscale.com/helmcharts
    version: 1.102.2
    releaseName: tailscale
    namespace: tailscale
    valuesInline:
      oauth:
        clientId: "" # Set via ExternalSecret
        clientSecret: "" # Set via ExternalSecret
      # Chart key is operatorConfig, not operator. Helm accepts unknown values
      # silently, so the previous `operator.hostname` was never applied and the
      # device registered under the chart default, colliding with an earlier
      # record and landing on tailscale-operator-1.
      operatorConfig:
        hostname: "talos-operator"
      apiServerProxyConfig:
        mode: "true"
      proxyConfig:
        defaultTags: "tag:service"
