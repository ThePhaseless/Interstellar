apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    name: tailscale
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-memory-request
  namespace: tailscale
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
