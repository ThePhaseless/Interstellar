---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik
  namespace: authentik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auth.nerine.dev`)
      services:
        - name: authentik-server
          port: 80
      middlewares:
        - name: public-chain
          namespace: traefik
  tls:
    certResolver: letsencrypt
    domains:
      - main: nerine.dev
        sans:
          - "*.nerine.dev"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: root-redirect
  namespace: authentik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nerine.dev`)
      services:
        - name: noop@internal
          kind: TraefikService
      middlewares:
        - name: public-chain
          namespace: traefik
        - name: redirect-to-auth
          namespace: traefik
  tls:
    certResolver: letsencrypt
    domains:
      - main: nerine.dev
        sans:
          - "*.nerine.dev"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-outpost
  namespace: authentik
spec:
  entryPoints:
    - websecure
  routes:
    - match: PathPrefix(`/outpost.goauthentik.io/`)
      priority: 15
      services:
        - name: authentik-server
          port: 80
  tls:
    certResolver: letsencrypt
    domains:
      - main: nerine.dev
        sans:
          - "*.nerine.dev"
