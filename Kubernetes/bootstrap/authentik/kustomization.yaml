apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: authentik

resources:
  - namespace.yaml
  - externalsecret.yaml
  - ingress.yaml

helmCharts:
  - name: authentik
    repo: https://charts.goauthentik.io
    version: 2026.8.3
    releaseName: authentik
    namespace: authentik
    valuesInline:
      authentik:
        secret_key: "" # Set via AUTHENTIK_SECRET_KEY env var from secret
        log_level: info
        error_reporting:
          enabled: false
        postgresql:
          password: "" # Set via AUTHENTIK_POSTGRESQL__PASSWORD env var from secret
          # Chart default is the bare "authentik-postgresql", which ndots:5
          # expands against every search domain -- up to 5 lookups per family
          # for one connect, each a chance to time out. Paired with ndots:2
          # below this resolves absolutely in one query.
          host: authentik-postgresql.authentik.svc.cluster.local
        email:
          host: "postfix.utilities.svc.cluster.local"
          port: 587
          username: ""
          password: ""
          use_tls: false
          use_ssl: false
          timeout: 30
          from: "noreply@nerine.dev"

      global:
        env:
          - name: AUTHENTIK_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: authentik-secrets
                key: authentik-secret-key
          - name: AUTHENTIK_POSTGRESQL__PASSWORD
            valueFrom:
              secretKeyRef:
                name: authentik-secrets
                key: authentik-postgresql-password
          - name: AUTHENTIK_BOOTSTRAP_TOKEN
            valueFrom:
              secretKeyRef:
                name: authentik-secrets
                key: authentik-bootstrap-token

      server:
        ingress:
          enabled: false # Using Traefik IngressRoute instead
        # Chart defaults (3s timeout, 3 failures over 30s) kill a healthy
        # server whenever Longhorn rebuild load slows the reply. Matches the
        # worker's tolerances below.
        livenessProbe:
          timeoutSeconds: 10
          periodSeconds: 20
          failureThreshold: 6
        readinessProbe:
          timeoutSeconds: 10
          periodSeconds: 20
          failureThreshold: 6
        startupProbe:
          timeoutSeconds: 10
          periodSeconds: 20
          failureThreshold: 90
        # glibc resolves A and AAAA in parallel over one socket, and the
        # conntrack DNAT race drops one often enough that resolving
        # authentik-postgresql fails on startup. The Python bootstrap retries
        # and wins; the Rust component (ak-common/src/db.rs) exits instead, so
        # the pod crash-looped hourly. single-request-reopen uses a separate
        # socket per query.
        dnsConfig:
          options:
            - name: single-request-reopen
            # Bare names (0 dots) still use the search list; anything already
            # qualified resolves in one query instead of five.
            - name: ndots
              value: "2"

      worker:
        dnsConfig:
          options:
            - name: single-request-reopen
            - name: ndots
              value: "2"
        livenessProbe:
          timeoutSeconds: 10
          periodSeconds: 20
          failureThreshold: 6
        readinessProbe:
          timeoutSeconds: 10
          periodSeconds: 20
          failureThreshold: 6
        startupProbe:
          timeoutSeconds: 10
          periodSeconds: 20
          failureThreshold: 90

      # --- Embedded PostgreSQL ---
      postgresql:
        enabled: true
        auth:
          existingSecret: authentik-secrets
          secretKeys:
            userPasswordKey: authentik-postgresql-password
        primary:
          persistence:
            enabled: true
            size: 5Gi
            storageClass: longhorn

      # --- Service Account (required for embedded outpost) ---
      serviceAccount:
        create: true
