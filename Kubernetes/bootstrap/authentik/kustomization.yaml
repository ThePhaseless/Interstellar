apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: authentik

resources:
  - namespace.yaml
  - externalsecret.yaml
  - ingress.yaml

helmCharts:
  - name: authentik
    repo: https://charts.goauthentik.io
    version: 2026.8.3
    releaseName: authentik
    namespace: authentik
    valuesInline:
      authentik:
        postgresql:
          host: authentik-postgresql.authentik.svc.cluster.local
        email:
          host: "postfix.utilities.svc.cluster.local"
          from: "noreply@nerine.dev"

      global:
        env:
          - name: AUTHENTIK_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: authentik-secrets
                key: authentik-secret-key
          - name: AUTHENTIK_POSTGRESQL__PASSWORD
            valueFrom:
              secretKeyRef:
                name: authentik-secrets
                key: authentik-postgresql-password
          - name: AUTHENTIK_BOOTSTRAP_TOKEN
            valueFrom:
              secretKeyRef:
                name: authentik-secrets
                key: authentik-bootstrap-token

      server:
        livenessProbe:
          timeoutSeconds: 10
          periodSeconds: 20
          failureThreshold: 6
        readinessProbe:
          timeoutSeconds: 10
          periodSeconds: 20
          failureThreshold: 6
        startupProbe:
          timeoutSeconds: 10
          periodSeconds: 20
          failureThreshold: 90
        dnsConfig:
          options:
            - name: single-request-reopen
            - name: ndots
              value: "2"

      worker:
        dnsConfig:
          options:
            - name: single-request-reopen
            - name: ndots
              value: "2"
        livenessProbe:
          timeoutSeconds: 10
          periodSeconds: 20
          failureThreshold: 6
        readinessProbe:
          timeoutSeconds: 10
          periodSeconds: 20
          failureThreshold: 6
        startupProbe:
          timeoutSeconds: 10
          periodSeconds: 20
          failureThreshold: 90

      postgresql:
        enabled: true
        auth:
          existingSecret: authentik-secrets
          secretKeys:
            userPasswordKey: authentik-postgresql-password
        primary:
          persistence:
            enabled: true
            size: 5Gi
            storageClass: longhorn
