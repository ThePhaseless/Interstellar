apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: traefik

resources:
  - namespace.yaml
  - middlewares.yaml
  - crowdsec-middleware.yaml
  - crowdsec-externalsecret.yaml
  - ingress.yaml
  - tls-options.yaml
  - backup-externalsecret.yaml
  - backup-cronjob.yaml

helmCharts:
  - name: traefik
    repo: https://helm.traefik.io/traefik
    version: 41.6.0
    releaseName: traefik
    namespace: traefik
    includeCRDs: true
    valuesInline:
      deployment:
        revisionHistoryLimit: 1
        podAnnotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8080"
        initContainers:
          - name: fix-acme-permissions
            image: busybox:1.38-musl@sha256:32b5cdad7cce41dfd53d0ae06baebcf8357a147ee7694dc706911c373bc30c37
            command:
              - /bin/sh
              - -c
              - |
                touch /data/acme.json
                chmod 600 /data/acme.json
                chown 65532:65532 /data/acme.json
            volumeMounts:
              - name: data
                mountPath: /data
        additionalVolumes:
          - name: crowdsec-secrets
            secret:
              secretName: crowdsec-bouncer-key
              defaultMode: 0400
              optional: true

      updateStrategy:
        type: Recreate

      podSecurityContext:
        fsGroup: 65532

      securityContext:
        capabilities:
          add:
            - NET_BIND_SERVICE

      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 1000m
          memory: 512Mi

      ports:
        web:
          http:
            redirections:
              entryPoint:
                to: websecure
                scheme: https
                permanent: true
                priority: 10
        websecure:
          http:
            middlewares:
              - "traefik-security-headers@kubernetescrd"
            tls:
              enabled: true
              certResolver: letsencrypt
              options: "nerine-tls@kubernetescrd"
              domains:
                - main: "nerine.dev"
                  sans:
                    - "*.nerine.dev"
          http3:
            enabled: true
            advertisedPort: 443
      service:
        spec:
          loadBalancerIP: 192.168.1.11
          externalTrafficPolicy: Local

      providers:
        kubernetesCRD:
          allowCrossNamespace: true
          allowExternalNameServices: true
        kubernetesIngress:
          allowExternalNameServices: true

      log:
        format: json
      accessLog:
        enabled: true
        format: json

      metrics:
        prometheus:
          entryPoint: traefik
          addEntryPointsLabels: true
          addRoutersLabels: true
          addServicesLabels: true

      additionalArguments:
        - "--global.checkNewVersion=false"
        - "--global.sendAnonymousUsage=false"
        - "--ping"
        - "--ping.entrypoint=traefik"

      certificatesResolvers:
        letsencrypt:
          acme:
            email: admin@nerine.dev
            storage: /data/acme.json
            dnsChallenge:
              provider: cloudflare
              delayBeforeCheck: 10
              resolvers:
                - "1.1.1.1:53"
                - "8.8.8.8:53"

      experimental:
        plugins:
          crowdsec-bouncer:
            moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
            version: "v1.5.0"

      persistence:
        enabled: true
        storageClass: longhorn
        size: 1Gi

      env:
        - name: CF_DNS_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-api-token
              key: api-token

      additionalVolumeMounts:
        - name: crowdsec-secrets
          mountPath: /secrets/crowdsec
          readOnly: true

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: traefik
                    app.kubernetes.io/instance: traefik
                topologyKey: kubernetes.io/hostname

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik

patches:
  - path: backup-common.yaml
    target:
      kind: CronJob
      labelSelector: backup=borg
  - target:
      kind: Deployment
      name: traefik
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: traefik
        annotations:
          argocd.argoproj.io/sync-options: ServerSideApply=true
  - target:
      kind: Service
      name: traefik
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: traefik
        annotations:
          argocd.argoproj.io/sync-options: ServerSideApply=true

configMapGenerator:
  - name: traefik-backup-script
    files:
      - scripts/borg-backup.sh
    options:
      disableNameSuffixHash: true
