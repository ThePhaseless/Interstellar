apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  labels:
    name: traefik
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: LimitRange
metadata:
  name: default-memory-request
  namespace: traefik
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
