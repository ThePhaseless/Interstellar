---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: traefik
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: "strict-origin-when-cross-origin"
    customFrameOptionsValue: "SAMEORIGIN"
    customResponseHeaders:
      Permissions-Policy: "geolocation=(), microphone=(), camera=()"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: timeout-standard
  namespace: traefik
spec:
  inFlightReq:
    amount: 500
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: timeout-streaming
  namespace: traefik
spec:
  inFlightReq:
    amount: 500
---
# Resolves to the private proxy provider (vips + admins) for every host except
# files.nerine.dev and add.nerine.dev, which forward_single providers claim.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik
  namespace: traefik
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    maxResponseBodySize: 4096
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
---
# Rate limiting comes from the CrowdSec bouncer.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: public-chain
  namespace: traefik
spec:
  chain:
    middlewares:
      - name: crowdsec-bouncer
      - name: timeout-standard
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-auth
  namespace: traefik
spec:
  redirectRegex:
    regex: "^https://nerine\\.dev(/.*)?$"
    replacement: "https://auth.nerine.dev/"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: streaming-chain
  namespace: traefik
spec:
  chain:
    middlewares:
      - name: crowdsec-bouncer
      - name: timeout-streaming
