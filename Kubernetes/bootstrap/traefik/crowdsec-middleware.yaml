---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec-bouncer
  namespace: traefik
spec:
  plugin:
    crowdsec-bouncer:
      enabled: true
      crowdsecMode: stream
      crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
      crowdsecLapiKeyFile: /secrets/crowdsec/crowdsecLapiKey
      # Trusted networks bypass ALL checks, including the AppSec WAF.
      clientTrustedIPs:
        - "192.168.1.0/24"
        - "10.244.0.0/16" # In-cluster callers, e.g. Jellyfin reaching Authentik via hostAliases
      crowdsecAppsecEnabled: true
      crowdsecAppsecHost: crowdsec-appsec-service.crowdsec.svc.cluster.local:7422
