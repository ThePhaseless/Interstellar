---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec-bouncer
  namespace: traefik
spec:
  plugin:
    crowdsec-bouncer:
      enabled: true
      logLevel: INFO
      updateIntervalSeconds: 60
      updateMaxFailure: 0
      defaultDecisionSeconds: 60
      httpTimeoutSeconds: 10
      # Stream mode - recommended for performance
      # Decisions are updated every 60 sec, requests hit local cache
      crowdsecMode: stream
      crowdsecLapiScheme: http
      crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
      # API key loaded from external secret via environment
      crowdsecLapiKeyFile: /secrets/crowdsec/crowdsecLapiKey
      # Trusted networks — bypass ALL checks (bans, rate limiting, AppSec WAF).
      # Tailscale operator uses L3 DNAT (does NOT forward real client IP — see
      # tailscale/tailscale#11024), so all Tailscale direct traffic appears as
      # the ts-traefik pod IP. The pod CIDR here is what actually matches that
      # traffic; 100.64.0.0/10 is kept for forward-compat if Tailscale ever
      # adds PROXY protocol support. Public traffic gets its real IP via
      # PROXY protocol from HAProxy, so it is NOT bypassed.
      clientTrustedIPs:
        - "100.64.0.0/10" # Tailscale CGNAT (forward-compat; not seen today due to DNAT)
        - "192.168.1.0/24" # Home LAN (direct access, bypasses Tailscale)
        - "10.244.0.0/16" # Pod CIDR — matches ts-traefik DNAT'd Tailscale traffic
      # Forward headers from HAProxy PROXY protocol
      forwardedHeadersCustomName: X-Forwarded-For
      forwardedHeadersTrustedIPs:
        - "100.64.0.0/10" # Tailscale (Oracle HAProxy)
        - "10.244.0.0/16" # Pod CIDR (ts-traefik proxy forwards real client IP)
      # AppSec WAF (virtual patching) — real-time request inspection
      # Blocks SQL injection, XSS, path traversal, RCE, known CVE exploits
      crowdsecAppsecEnabled: true
      crowdsecAppsecHost: crowdsec-appsec-service.crowdsec.svc.cluster.local:7422
      crowdsecAppsecFailureBlock: true
      crowdsecAppsecUnreachableBlock: true
