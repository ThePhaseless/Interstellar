---
# No CBC ciphers, to mitigate LUCKY13 / CVE-2013-0169. Only TLS 1.2 needs the
# list below; TLS 1.3 is AEAD-only already.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: nerine-tls
  namespace: traefik
spec:
  minVersion: VersionTLS12
  maxVersion: VersionTLS13
  cipherSuites:
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
  sniStrict: true
