name: Ansible Lint

on:
  push:
    branches: [main, migration]
    paths:
      - "Ansible/**"
      - ".github/workflows/ansible-lint.yaml"
  pull_request:
    branches: [main, migration]
    paths:
      - "Ansible/**"
      - ".github/workflows/ansible-lint.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ansible-lint-${{ github.ref }}
  cancel-in-progress: true

env:
  ANSIBLE_DIR: "./Ansible"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        run: uv tool install ansible-core && uv tool install ansible-lint

      - name: Cache Ansible Galaxy content
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ${{ runner.os }}-ansible-galaxy-${{ hashFiles('Ansible/requirements.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ansible-galaxy-

      - name: Install Ansible collections
        run: ansible-galaxy install -r requirements.yaml
        working-directory: ${{ env.ANSIBLE_DIR }}

      - name: Run ansible-lint
        run: ansible-lint ${{ env.ANSIBLE_DIR }}
