name: Oracle Bootstrap

# Enrols the Oracle proxy VPS when it is not on the tailnet yet, which the
# regular Ansible workflow cannot do: its inventory only sees tailnet members.
# 'compute' is a personal device and is never touched by this workflow.
# Public SSH is opened for the duration of the run and closed again in a step
# that always runs, including on failure or cancellation.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_WORKING_DIR: "./Terraform"
  ANSIBLE_DIR: "./Ansible"

concurrency:
  group: oracle-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get Secrets from Bitwarden
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BWS_ID_OCI_CONFIG }} > OCI_CONFIG
            ${{ vars.BWS_ID_OCI_PRIVATE_KEY }} > OCI_PRIVATE_KEY
            ${{ vars.BWS_ID_OCI_NAMESPACE }} > OCI_NAMESPACE
            ${{ vars.BWS_ID_TF_STATE_BUCKET }} > TF_STATE_BUCKET
            ${{ vars.BWS_ID_HCLOUD_TOKEN }} > HCLOUD_TOKEN
            ${{ vars.BWS_ID_GH_APP_ID }} > GH_APP_ID
            ${{ vars.BWS_ID_GH_APP_PRIVATE_KEY }} > GH_APP_PRIVATE_KEY
            ${{ vars.BWS_ID_ORACLE_SSH_PRIVATE_KEY }} > ORACLE_SSH_KEY
            ${{ vars.BWS_ID_TAILSCALE_ORACLE_AUTH_KEY }} > TS_ORACLE_AUTHKEY

      - name: Mask Bitwarden-fetched values
        run: |
          for v in OCI_CONFIG OCI_PRIVATE_KEY OCI_NAMESPACE TF_STATE_BUCKET \
            HCLOUD_TOKEN GH_APP_ID GH_APP_PRIVATE_KEY ORACLE_SSH_KEY TS_ORACLE_AUTHKEY; do
            # add-mask registers a single line, so multi-line PEMs are masked line by line
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::add-mask::$line"
            done <<< "${!v:-}"
          done
          true

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ env.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}

      - name: Install BWS CLI
        run: |
          curl -sSL https://github.com/bitwarden/sdk/releases/download/bws-v1.0.0/bws-x86_64-unknown-linux-gnu-1.0.0.zip -o bws.zip
          unzip -o bws.zip
          chmod +x bws
          sudo mv bws /usr/local/bin/

      - name: Set Provider Environment Variables
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BW_ACCESS_TOKEN }}
        run: |
          echo "BW_ACCESS_TOKEN=${{ secrets.BW_ACCESS_TOKEN }}" >> $GITHUB_ENV

          ORG_ID="${{ vars.BW_ORGANIZATION_ID }}"
          if [ -z "$ORG_ID" ]; then
            ORG_ID=$(bws project list --output json --color no | tr -cd '[:print:]\t\n' | jq -r '.[0].organizationId // empty')
          fi

          if [ -n "$ORG_ID" ]; then
            echo "BW_ORGANIZATION_ID=$ORG_ID" >> $GITHUB_ENV
          else
            echo "::error::Could not determine Bitwarden Organization ID"
            exit 1
          fi

          echo "TF_VAR_bws_access_token=${{ secrets.BW_ACCESS_TOKEN }}" >> $GITHUB_ENV
          echo "TF_VAR_hcloud_token=$HCLOUD_TOKEN" >> $GITHUB_ENV

      - name: Write OCI config
        shell: bash
        run: |
          mkdir -p "$HOME/.oci"

          printf "%s" "$OCI_CONFIG" > "$HOME/.oci/config"
          [ -n "$(tail -c1 "$HOME/.oci/config")" ] && echo "" >> "$HOME/.oci/config"

          printf "%s" "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/config" "$HOME/.oci/oci_api_key.pem"

          if grep -q '^key_file=' "$HOME/.oci/config"; then
            sed -i "s|^key_file=.*|key_file=$HOME/.oci/oci_api_key.pem|" "$HOME/.oci/config"
          else
            echo "key_file=$HOME/.oci/oci_api_key.pem" >> "$HOME/.oci/config"
          fi

          echo "OCI_CLI_CONFIG_FILE=$HOME/.oci/config" >> $GITHUB_ENV
          echo "OCI_CLI_KEY_FILE=$HOME/.oci/oci_api_key.pem" >> $GITHUB_ENV
          echo "OCI_CLI_USER=$(grep '^user=' $HOME/.oci/config | head -1 | cut -d'=' -f2 | tr -d '[:space:]')" >> $GITHUB_ENV
          echo "OCI_CLI_TENANCY=$(grep '^tenancy=' $HOME/.oci/config | head -1 | cut -d'=' -f2 | tr -d '[:space:]')" >> $GITHUB_ENV
          echo "OCI_CLI_FINGERPRINT=$(grep '^fingerprint=' $HOME/.oci/config | head -1 | cut -d'=' -f2 | tr -d '[:space:]')" >> $GITHUB_ENV
          echo "OCI_CLI_REGION=$(grep '^region=' $HOME/.oci/config | head -1 | cut -d'=' -f2 | tr -d '[:space:]')" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="namespace=${{ env.OCI_NAMESPACE }}"
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install Ansible
        run: uv tool install ansible-core

      - name: Cache Ansible Galaxy content
        uses: actions/cache@v6
        with:
          path: |
            ~/.ansible/collections
            ~/.ansible/roles
          key: ${{ runner.os }}-ansible-galaxy-${{ hashFiles('Ansible/requirements.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ansible-galaxy-

      - name: Install Ansible collections
        run: ansible-galaxy install -r requirements.yaml
        working-directory: ${{ env.ANSIBLE_DIR }}

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ env.ORACLE_SSH_KEY }}

      - name: Find this runner's public IP
        id: runner-ip
        run: |
          ip=$(curl -fsS --retry 3 https://api.ipify.org)
          if [ -z "$ip" ]; then
            echo "::error::Could not determine the runner's public IP; refusing to open SSH to 0.0.0.0/0"
            exit 1
          fi
          echo "cidr=$ip/32" >> "$GITHUB_OUTPUT"

      - name: Open public SSH
        run: |
          terraform apply -auto-approve -lock-timeout=2m -no-color \
            -target=oci_core_security_list.main \
            -var="oracle_ssh_public_access=true" \
            -var="oracle_ssh_source_cidr=$SSH_SOURCE_CIDR"
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          SSH_SOURCE_CIDR: ${{ steps.runner-ip.outputs.cidr }}
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Read the proxy public IP from Terraform
        id: proxy
        run: |
          echo "ip=$(terraform output -raw oracle_proxy_public_ip)" >> "$GITHUB_OUTPUT"
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Run bootstrap playbook
        timeout-minutes: 15
        run: |
          ansible-playbook bootstrap-oracle.yaml -i "$PROXY_IP,"
        working-directory: ${{ env.ANSIBLE_DIR }}
        env:
          PROXY_IP: ${{ steps.proxy.outputs.ip }}
          TAILSCALE_ORACLE_AUTH_KEY: ${{ env.TS_ORACLE_AUTHKEY }}

      # Runs on success, failure and cancellation. The lock wait is kept under
      # GitHub's ~5 minute cancellation grace so this cannot be killed mid-wait
      # with the rule still applied, and it retries rather than giving up on one
      # transient API error.
      - name: Close public SSH
        if: always()
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            if terraform apply -auto-approve -lock-timeout=2m -no-color \
              -target=oci_core_security_list.main \
              -var="oracle_ssh_public_access=false"; then
              echo "Public SSH closed."
              exit 0
            fi
            echo "::warning::Close attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          echo "::error::Could not close public SSH after 3 attempts — port 22 may still be open"
          exit 1
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
